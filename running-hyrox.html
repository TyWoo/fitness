<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Running for HYROX 2.0</title>
<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --panel2:#f0eee9; --ink:#1b1c1f; --muted:#6b6d73; --line:#e3e0d9;
  --accent:#e2541b; --accent-ink:#fff; --good:#1f8a4c; --warn:#c98a05; --bad:#b53a3a;
  --t-test:#7a4fd1; --t-threshold:#e2541b; --t-hyrox:#c2186b; --t-speed:#d4a106; --t-strength:#2c6fd6; --t-aerobic:#1f8a4c; --t-mobility:#1a9aa0; --t-rest:#8a8d93; --t-recap:#8a6d3b;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --panel:#171a20; --panel2:#1f232b; --ink:#eceef2; --muted:#9aa0aa; --line:#2a2f38;
    --shadow:none;
  }
}
:root[data-theme="dark"]{ --bg:#0f1115; --panel:#171a20; --panel2:#1f232b; --ink:#eceef2; --muted:#9aa0aa; --line:#2a2f38; --shadow:none; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 80px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:auto}
.brand b{font-size:16px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:999px}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.pbar{height:6px;border-radius:99px;background:var(--panel2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:13px}
.hidden{display:none!important}
/* hero */
.hero{margin:16px 0;padding:16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.hero h2{margin:0 0 4px;font-size:18px}
.hero .next{font-size:14px}
/* week chips */
.weeks{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.wchip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 10px 7px;cursor:pointer;min-width:56px;text-align:center}
.wchip b{display:block;font-size:13px}
.wchip .pbar{height:4px;margin-top:5px}
.wchip.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.wchip.cur b::after{content:"•";color:var(--accent);margin-left:3px}
/* layout */
.layout{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.list{padding:6px}
.week-head{padding:10px 10px 6px;display:flex;justify-content:space-between;align-items:baseline}
.week-head h3{margin:0;font-size:16px}
.sess{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.sess:hover{background:var(--panel2)}
.sess.on{background:var(--panel2);border-color:var(--line)}
.sess.today .dname::after{content:"Today";margin-left:6px;font-size:10px;font-weight:700;background:var(--accent);color:#fff;padding:1px 6px;border-radius:99px;vertical-align:1px}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
.dot.done{background:var(--good);border-color:var(--good)}
.dot.partial{background:var(--warn);border-color:var(--warn)}
.dot.skipped{background:var(--bad);border-color:var(--bad)}
.sess .t{min-width:0}
.sess .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .dname{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;color:#fff;margin-right:4px;text-transform:uppercase;letter-spacing:.03em}
.tag.test{background:var(--t-test)} .tag.threshold{background:var(--t-threshold)} .tag.hyrox{background:var(--t-hyrox)} .tag.speed{background:var(--t-speed)} .tag.strength{background:var(--t-strength)} .tag.aerobic{background:var(--t-aerobic)} .tag.mobility{background:var(--t-mobility)} .tag.rest{background:var(--t-rest)} .tag.recap{background:var(--t-recap)}
.bar-l{width:4px;height:30px;border-radius:4px}
/* detail */
.detail{padding:18px 20px 22px;min-height:300px}
.detail h2{margin:2px 0 6px;font-size:22px;letter-spacing:-.01em;line-height:1.25}
.backbtn{display:none}
.content{margin-top:10px}
.content h3,.content h4,.content h5{margin:18px 0 6px;line-height:1.3}
.content h3{font-size:17px} .content h4{font-size:15px;color:var(--accent);text-transform:none} .content h5{font-size:14px}
.content p{margin:6px 0}
.content ul,.content ol{margin:4px 0 8px;padding-left:22px}
.content li p{margin:2px 0}
.content hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.content blockquote{margin:10px 0;padding:8px 12px;border-left:3px solid var(--accent);background:var(--panel2);border-radius:0 8px 8px 0}
.content a.vid::after{content:" ▶";font-size:10px;opacity:.7}
.restbox{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:12px;margin-top:14px}
/* log */
.log{margin-top:18px;padding:16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.log h3{margin:0 0 10px;font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on[data-v="done"]{background:var(--good);color:#fff}
.seg button.on[data-v="partial"]{background:var(--warn);color:#fff}
.seg button.on[data-v="skipped"]{background:var(--bad);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
label.f input,label.f select,textarea{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 10px;font-size:15px;color:var(--ink);width:100%}
textarea{min-height:80px;resize:vertical}
.calc{font-size:13px;margin-top:6px;color:var(--muted)}
.calc b{color:var(--ink)}
.sub{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.sub h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.saved{font-size:12px;color:var(--good);opacity:0;transition:opacity .3s}
.saved.show{opacity:1}
.prompt{font-size:17px;font-weight:600;margin:8px 0}
.example{font-size:13px;color:var(--muted);font-style:italic;margin:6px 0 10px}
/* progress */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.stat{padding:14px}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat .l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.sec{padding:16px;margin-bottom:16px}
.sec h3{margin:0 0 4px;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tscroll{overflow-x:auto}
.wkbars{display:grid;grid-template-columns:repeat(13,1fr);gap:6px;align-items:end;height:120px;margin-top:10px}
.wkbars div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11px;color:var(--muted)}
.wkbars span.b{width:100%;max-width:34px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px}
.wkbars span.bg{width:100%;max-width:34px;background:var(--panel2);border-radius:6px 6px 2px 2px;position:relative;flex:1;display:flex;align-items:flex-end}
.chart svg{width:100%;height:auto;display:block}
.empty{padding:14px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:10px;margin-top:10px}
.typebars .r{display:grid;grid-template-columns:90px 1fr 60px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.banner{margin:12px 0;padding:10px 14px;border-radius:10px;background:color-mix(in srgb,var(--warn) 15%,var(--panel));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));font-size:14px}
/* analysis panel */
.analysis{margin-top:18px;padding:16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.analysis h3{margin:0 0 12px;font-size:17px}
.analysis h4{margin:14px 0 6px;font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.zone-bar{display:flex;height:28px;border-radius:8px;overflow:hidden;margin:6px 0 8px;font-size:11px;font-weight:700;color:#fff}
.zone-bar span{display:flex;align-items:center;justify-content:center;min-width:0;transition:width .3s}
.zone-bar .z1{background:#4a90d9} .zone-bar .z2{background:#1f8a4c} .zone-bar .z3{background:#c98a05} .zone-bar .z4{background:#e2541b} .zone-bar .z5{background:#b53a3a}
.zone-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;margin-bottom:10px}
.zone-legend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.zone-legend .z1::before{background:#4a90d9} .zone-legend .z2::before{background:#1f8a4c} .zone-legend .z3::before{background:#c98a05} .zone-legend .z4::before{background:#e2541b} .zone-legend .z5::before{background:#b53a3a}
.splits-tbl{width:100%;border-collapse:collapse;font-size:13px}
.splits-tbl th{text-align:left;font-weight:600;padding:4px 8px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.splits-tbl td{padding:4px 8px;border-bottom:1px solid var(--line)}
.splits-tbl tr:last-child td{border-bottom:none}
.pace-fast{color:var(--good);font-weight:600} .pace-slow{color:var(--bad);font-weight:600}
.metric-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;flex:1;min-width:80px;text-align:center}
.metric .v{font-size:18px;font-weight:800;color:var(--ink)} .metric .l{font-size:11px;color:var(--muted);margin-top:2px}
.progress-row{display:flex;align-items:center;gap:6px;font-size:13px;margin:4px 0}
.progress-row .delta{font-weight:700} .progress-row .delta.better{color:var(--good)} .progress-row .delta.worse{color:var(--bad)}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .layout.showing .list{display:none}
  .layout:not(.showing) .detail{display:none}
  .backbtn{display:inline-flex}
  .hero{grid-template-columns:1fr}
  .tabs button{padding:6px 10px}
  .wkbars{gap:3px}
}
@media print{ header.top,.weeks,.list,.log,.backbtn,.hero{display:none!important} .layout{display:block} .detail{border:0} }
.tag.info{background:#6b7280}
.lib-group{margin:18px 0 6px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{padding:14px;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.pcard:hover{border-color:var(--muted)}
.pcard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.pcard b{font-size:15px;line-height:1.3}
.pcard .meta{font-size:12px;color:var(--muted)}
.badge{display:inline-block;font-size:10px;font-weight:800;background:var(--accent);color:#fff;border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:2px;text-transform:uppercase;letter-spacing:.04em}
.progname{font-size:12px;color:var(--muted);font-weight:600}
.wkbars{grid-template-columns:repeat(var(--cols,13),1fr)}
</style>
</head>

</header>

<div class="wrap">

</div>

<script>
const PROGRAMS = [{"id": 2133452, "name": "Running for HYROX 2.0", "group": "Base Build", "weeks": [{"n": 1, "label": "W1", "name": "Week 1", "sessions": [{"id": 2496598, "di": 0, "day": "Monday", "title": "MAF Benchmark Test", "tags": ["test"], "special": "maf", "html": "<h3><i><b>Note** If you recently completed this during “on-ramp”, then sub this for an 5k-10k Z2 run. <\/b><\/i><\/h3><p><b>Focus:<\/b> Aerobic efficiency + long-term progress tracking<br>This test is all about measuring your aerobic fitness at a consistent effort level. You’ll move at a steady pace and track your time — not to race, but to <i>retest and reveal<\/i> your progress over time.<\/p><hr><h4><b>Prep<\/b><\/h4><p><b>5 minutes Backwards Walking<\/b><br>Get the body moving, warm the knees, and open up your stride.<\/p><ul><li><p><a href=\"https://youtu.be/CFigpGBXB_s\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Marching Running<\/a> 2 x 10 meters<\/p><p><a href=\"https://youtu.be/N9Fw1IWtFeQ\" target=\"_blank\" rel=\"noopener\" class=\"vid\">A-Skips <\/a>2 x 10-15 m <\/p><p><a href=\"https://youtu.be/Zy97yNE7WEE\" target=\"_blank\" rel=\"noopener\" class=\"vid\">B-Skips<\/a> 2 x 10-15 m<br><\/p><ul><li><p>These help prep your body for efficient, relaxed movement before the benchmark begins.<\/p><\/li><\/ul><\/li><\/ul><hr><h4><b>MAF Benchmark Test<\/b><\/h4><p><b>Aerobic Benchmark<\/b><\/p><p><b>15 min Easy Aerobic Warm-Up<\/b><\/p><ul><li><p>Run is preferred — the goal is to gradually bring your heart rate into your aerobic zone<\/p><\/li><\/ul><p><b>8K For Time @ MAF Heart Rate <\/b><\/p><ul><li><p>Use the formula <b>180 – your age<\/b> to find your estimated MAF heart rate<\/p><ul><li><p>If you know your heart rate zones, aim for the <b>middle of Zone 2<\/b><\/p><\/li><\/ul><\/li><li><p><b>The scoring starts once you hit your Target HR<\/b><\/p><\/li><li><p><b>Record your split every 1000m<\/b><\/p><\/li><\/ul><p><b>5K For Time @ MAF Heart Rate (Beginner)<\/b><\/p><p><b>10–15 min Easy Cool-Down<\/b><br>Bring the heart rate down gradually and stay relaxed. Easy jog or walk.<\/p><hr><h4><b>Coaching Tips<\/b><\/h4><ul><li><p>Run this on a <b>completely flat path, track, or treadmill<\/b><\/p><\/li><li><p>Keep as many factors consistent as possible — same route, time of day, gear, etc.<\/p><\/li><li><p><i>We’ll retest this periodically on the exact same route to track progress<\/i><\/p><\/li><li><p><b>Your pace should feel almost too easy<\/b> — and that’s exactly the point<\/p><\/li><li><p>Over time, as your aerobic base improves, you’ll cover more distance at the same effort level<\/p><\/li><\/ul>"}, {"id": 2496611, "di": 1, "day": "Tuesday", "title": "Running Strength Day", "tags": ["strength"], "html": "<p><b>Focus:<\/b> Joint durability, eccentric control, and explosive strength<br>This session trains the full system — from ankle strength and hip control to deadlifts and plyometrics. Expect slow eccentrics, power output, and core-focused finishers.<\/p><hr><h4><b>Prep &amp; Joint Strength Work<\/b><\/h4><p><b><a href=\"https://youtu.be/RUXLuZ_GLrE\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Heels-Elevated Squat<\/a><\/b><b> – Tempo 4/2/1/1<\/b><br>Use a controlled 4-second descent, 2-second pause at the bottom, 1-second rise, and 1-second pause at the top.<\/p><p><b><a href=\"https://youtu.be/pz70FwVRDJE\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Tibialis Raise<\/a><\/b><b> – 1x30<\/b><br>Slow and controlled. Focus on activation through the shins.<\/p><p><b><a href=\"https://youtu.be/CufVyiLj878\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Calf Raise<\/a><\/b><b> – 1x20–30 Each Leg<\/b><br>Pause at the top, lower with control. Train full range.<\/p><p><b><a href=\"https://youtu.be/AzbtpwYr2So\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Poliquin Step-Up<\/a><\/b><b> – 2x20<\/b><br>Heel elevated. Drive knee forward over toes. Keep balance and posture tight.<\/p><p><b><a href=\"https://youtu.be/KmfmXwvdwVU\" target=\"_blank\" rel=\"noopener\" class=\"vid\">ATG Lunges<\/a><\/b><b> – 3x10 Each Leg<\/b><br>Controlled, deep range of motion. Heel stays down, chest tall.<\/p><hr><h4><b>Super Set – 3 Rounds<\/b><\/h4><ul><li><p><b><a href=\"https://youtu.be/_t9edkC6aa0\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Calf Isometric Hold <\/a><\/b><b>– 3 sec<\/b> at top position<\/p><\/li><li><p><b><a href=\"https://youtu.be/YGlAdtSKQaU\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Jefferson Curl<\/a><\/b><b> – 3 reps<\/b> slow and smooth, full spinal articulation<\/p><\/li><\/ul><hr><h4><b>Power &amp; Plyos<\/b><\/h4><p><b>Sled Push – 1x50m<\/b><br>Unbroken, steady effort. Drive through your legs and keep posture tight.<\/p><p><b><a href=\"https://www.youtube.com/shorts/ak8BTDZJd7M\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Single-Leg Broad Jump<\/a><\/b><b> – 3x2 Each Leg<\/b><br>Stick each landing. Focus on power and body control.<\/p><p><b><a href=\"https://youtu.be/j260zYfRz8Q\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Standing Vertical Jump<\/a><\/b><b> – 3x2<\/b><br>Reset between reps. Max height with clean form.<\/p><hr><h4><b>Main Lift<\/b><\/h4><p><b>Deadlift – 3x5 @ 80–85%<\/b><br>Heavy but clean. Prioritize bar path and full-body tension.<br><i>Rest 90–120 seconds between sets<\/i><\/p><hr><h4><b>Strength Super Set – 3 Rounds<\/b><\/h4><ul><li><p><b>Heels-Elevated Goblet Squat – x15<\/b><\/p><\/li><li><p><b>Pull-Up – x2 RIR<\/b><br>Leave 2 reps in the tank. Scale with bands if needed.<br><i>Rest 60 seconds between rounds<\/i><\/p><\/li><\/ul><hr><h4><b>Accessory Finisher<\/b><\/h4><ul><li><p><b><a href=\"https://youtu.be/6dHvTlsMvNY\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Toes-to-Bar<\/a><\/b><b> – x2 RIR<\/b><\/p><\/li><li><p><b>Push-Ups – x2 RIR<\/b><br>Control the movement, maintain good form. Finish strong.<\/p><\/li><\/ul><hr><h3><b>AEROBIC OPTION<\/b> <i>(Standalone or Add-On)<\/i><\/h3><p><b>4 Rounds:<\/b><\/p><ul><li><p><b>3 min Row<\/b><\/p><\/li><li><p><b>3 min Ski<\/b><\/p><\/li><li><p><b>3 min Bike or Run<\/b><\/p><\/li><\/ul><p>Stay in Zone 2 throughout — smooth, steady, and sustainable effort. Perfect for recovery or a base-building add-on.<\/p>"}, {"id": 2496616, "di": 2, "day": "Wednesday", "title": "Max Heart Rate Ramp Test", "tags": ["test"], "special": "maxhr", "html": "<p><b>Focus:<\/b> Finding your max heart rate through progressive intensity<br>This test is designed to push you to your absolute limit. You'll ramp up effort gradually and finish with a full-out push to help determine your <i>true<\/i> maximum heart rate — a critical marker for training zones and future progress.<\/p><hr><h4><b>Prep<\/b><\/h4><p><b>5 minutes Backwards Walking<\/b><br>Great for knees, ankles, and prepping your legs for work.<\/p><p><b><a href=\"https://youtu.be/vOdqpJjDH_A\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Happy Hip Walk <\/a><\/b><br>2×50 m <\/p><p><b>Running Drills:<\/b><\/p><ul><li><p><b>A-Skips<\/b><\/p><\/li><li><p><b>B-Skips<\/b><br>Build coordination, posture, and rhythm before things start to heat up.<\/p><\/li><\/ul><hr><h4><b>Ramp Test – Main Set<\/b><\/h4><p><b>10–15 min Easy Aerobic Warm-Up (Zone 2)<\/b><br>Ease into the session and settle into your rhythm. You should feel light and relaxed here.<\/p><hr><p><b>Ramp Build<\/b><\/p><p>Each interval increases in effort. Focus on breathing, posture, and pace control.<\/p><ul><li><p><b>5 min @ Marathon Pace<\/b><br><i>(Roughly 50–60 seconds slower than your 5K pace)<\/i><\/p><\/li><li><p><b>5 min @ Slightly Faster<\/b><br><i>(Drop pace by 10–15 sec/mile)<\/i><\/p><\/li><li><p><b>5 min @ Faster Again<\/b><br><i>(Drop pace by another 10–15 sec/mile)<\/i><\/p><\/li><li><p><b>1 min @ Faster<\/b><\/p><\/li><li><p><b>1 min @ Faster<\/b><\/p><\/li><li><p><b>1 min @ Faster<\/b><\/p><\/li><li><p><b>1 min @ Faster<\/b><\/p><\/li><li><p><b>1–3 min All-Out Max Effort<\/b><br><i>(Drop pace by 5–10 sec each interval — finish at your absolute edge)<\/i><\/p><\/li><\/ul><hr><h4><b>Cool-Down<\/b><\/h4><p><b>10–15 min Easy Jog or Walk (Zone 2)<\/b><br>Let your heart rate come down gradually. Use this time to recover and reflect.<\/p><hr><h4><b>Coaching Tips<\/b><\/h4><ul><li><p>The final minutes should feel close to <b>all-out effort<\/b> — it’s okay if it’s unsustainable<\/p><\/li><li><p>This test is about <b>effort<\/b>, not pace — your goal is to max out your heart rate, not hit a specific split<\/p><\/li><li><p>Don’t hold back in the final reps — you need to push to your edge to get accurate data<\/p><\/li><li><p>We’ll use this number to fine-tune your training zones moving forward<\/p><\/li><\/ul><p>▶️ <b>Video Explanation:<\/b> <a href=\"https://www.loom.com/share/4034104dbfa54af28b32a81ad5875c16\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Watch here<\/a><\/p>"}, {"id": 2496619, "di": 3, "day": "Thursday", "title": "Mobility + Mechanical Fartlek", "tags": ["aerobic", "mobility"], "html": "<p><b>Focus:<\/b> Pre-run mobility + aerobic efficiency with perfect form<br>This session begins with targeted joint prep and mobility work, then transitions into a Zone 2 fartlek designed to improve form, flow, and rhythm — without going above aerobic effort.<\/p><hr><h4><b>Mobility – Kruse + Static Stretch<\/b><\/h4><p>Spend time moving through each of the following. Breathe deeply, move intentionally, and don’t rush it.<\/p><p><b>Foot &amp; Lower Leg:<\/b><\/p><ul><li><p><b><a href=\"https://youtu.be/AYj39MojI7E\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Ankle Roll <\/a><\/b> – Gentle circles - 6-10 each direction and side <\/p><\/li><li><p><b>Knee Roll<\/b> – Small controlled circles to wake up the joint<\/p><\/li><li><p><b>Hip Roll<\/b> – Big slow circles, loosen the hips<\/p><\/li><li><p><b>Front Hip Roll<\/b> – Focus on deep flexion and control<\/p><\/li><\/ul><p><b>Upper &amp; Lower Body Static Stretching:<\/b><\/p><ul><li><p><b>Pec Stretch<\/b> – Use a doorway or wall<\/p><\/li><li><p><b>Lat Stretch (Prayer Pose)<\/b> – Hands forward, hips back<\/p><\/li><li><p><b>Couch Stretch<\/b> – Quads and hip flexors<\/p><\/li><li><p><b>Knight Stretch<\/b> – Groin and hamstrings<\/p><\/li><li><p><b>Pigeon Pose<\/b> – Glutes and external hip rotation<\/p><\/li><\/ul><hr><h4><b>Mechanical Fartlek – 32–40 Minutes<\/b><\/h4><p><b>Structure:<\/b><\/p><ul><li><p><b>2 min uptempo<\/b> with <b>perfect form<\/b><\/p><ul><li><p>Focus on posture, rhythm, and quick turnover<\/p><\/li><li><p>Keep heart rate <b>at or below 180 – your age<\/b> (<i>or 75% max HR<\/i>)<\/p><\/li><\/ul><\/li><li><p><b>2 min easier<\/b> — still <b>perfect form<\/b>, just 10–20 seconds per mile slower<\/p><ul><li><p>Keep moving with purpose — this is not a rest jog<\/p><\/li><\/ul><\/li><\/ul><p><b>Goal:<\/b><\/p><ul><li><p>Stay in <b>Zone 2<\/b> the entire run<\/p><\/li><li><p>Prioritize <b>efficiency over intensity<\/b><\/p><\/li><li><p>You’re teaching your body to move well at all speeds, without overreaching<\/p><\/li><\/ul>"}, {"id": 2496622, "di": 4, "day": "Friday", "title": "Running Strength Day", "tags": ["strength"], "html": "<p><b>Focus:<\/b> Eccentric control, joint prep, and total-body power<br>This session targets strength and durability for runners — combining tempo work, plyometrics, and controlled strength lifts to build more resilient, explosive movement.<\/p><hr><h4><b>Prep &amp; Joint Strength<\/b><\/h4><p><b><a href=\"https://youtu.be/RUXLuZ_GLrE\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Heels-Elevated Squat<\/a><\/b><b> – Tempo 4/2/1/1<\/b><br>Use a controlled 4-second descent, 2-second pause at the bottom, 1-second rise, and 1-second pause at the top.<\/p><p><b><a href=\"https://youtu.be/pz70FwVRDJE\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Tibialis Raise<\/a><\/b><b> – 1x30<\/b><br>Slow and controlled. Focus on activation through the shins.<\/p><p><b><a href=\"https://youtu.be/CufVyiLj878\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Calf Raise<\/a><\/b><b> – 1x20–30 Each Leg<\/b><br>Pause at the top, lower with control. Train full range.<\/p><p><b><a href=\"https://youtu.be/AzbtpwYr2So\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Poliquin Step-Up<\/a><\/b><b> – 2x20<\/b><br>Heel elevated. Drive knee forward over toes. Keep balance and posture tight.<\/p><p><b><a href=\"https://youtu.be/KmfmXwvdwVU\" target=\"_blank\" rel=\"noopener\" class=\"vid\">ATG Lunges<\/a><\/b><b> – 3x10 Each Leg<\/b><br>Controlled, deep range of motion. Heel stays down, chest tall.<\/p><hr><h4><b>Super Set – 3 Rounds<\/b><\/h4><ul><li><p><b><a href=\"https://youtu.be/_t9edkC6aa0\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Calf Isometric Hold <\/a><\/b><b>– 3 sec<\/b> at top position<\/p><\/li><li><p><b><a href=\"https://youtu.be/YGlAdtSKQaU\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Jefferson Curl<\/a><\/b><b> – 3 reps<\/b> slow and smooth, full spinal articulation<\/p><\/li><\/ul><hr><h4><b>Power &amp; Plyos<\/b><\/h4><p><b><a href=\"https://youtu.be/k7JsvdG9sSo\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Sled Drag<\/a><\/b><b> – 1x50m<\/b><br>Steady and unbroken. Stay low and drive through your legs.<\/p><p><b><a href=\"https://youtu.be/LDU_yVvp7pA\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Single-Leg Box Jump<\/a><\/b><b> – 3x2 each leg<\/b><br>Use stacked plates or a very low box. Focus on balance and control.<\/p><p><b><a href=\"https://youtu.be/uhz-ia-2UcM\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Standing Broad Jump<\/a><\/b><b> – 3x2<\/b><br>Explosive takeoff, soft landing. Reset between reps.<\/p><hr><h4><b>Main Strength Lift<\/b><\/h4><p><b><a href=\"https://youtu.be/U5Q5HfUyy78\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Barbell Reverse Lunge<\/a><\/b><b> – 3x5 each leg<\/b><br>Smooth and strong. Keep your torso upright and step back with control.<br><i>Rest 90–120 seconds between sets<\/i><\/p><hr><h4><b>Strength Super Set – 3 Rounds<\/b><\/h4><ul><li><p><b><a href=\"https://youtu.be/pUdIL5x0fWg\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Hip Thrusts<\/a><\/b><b> – x10<\/b><\/p><\/li><li><p><b><a href=\"https://youtu.be/_aISMzimYEA\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Strict Press<\/a><\/b><b> – x10<\/b><br>Drive through the glutes, then shift to upper-body control.<br><i>Rest 60 seconds between rounds<\/i><\/p><\/li><\/ul><hr><h4><b>Accessory Finisher<\/b><\/h4><ul><li><p><b><a href=\"https://youtu.be/drtWxWK8QOM\" target=\"_blank\" rel=\"noopener\" class=\"vid\">GHD Sit-Ups<\/a><\/b><b> – x10<\/b> <i>(or 30 crunches)<\/i><\/p><\/li><li><p><b><a href=\"https://youtu.be/Hh3EFRiRobc\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Single Arm Farmer’s Carry<\/a><\/b><b> – 50m @ heavy<\/b><br>One arm at a time. Stay tall, avoid leaning. Core stays braced.<\/p><\/li><\/ul><hr><h3><b>WORKOUT: Aerobic Option<\/b><\/h3><p><b>Focus:<\/b> Low-intensity steady-state conditioning<br>A recovery-friendly cardio circuit designed to build your aerobic base without overloading the nervous system.<\/p><hr><h4><b>Main Set – 4 Rounds:<\/b><\/h4><ul><li><p><b>3 min Row<\/b><\/p><\/li><li><p><b>3 min Ski<\/b><\/p><\/li><li><p><b>3 min Bike or Run<\/b><\/p><\/li><\/ul><p>Keep the intensity at <b>Zone 2<\/b> — steady, controlled breathing, and smooth movement. You should finish feeling energized, not exhausted.<\/p>"}, {"id": 2496625, "di": 5, "day": "Saturday", "title": "Compromised Run Benchmark", "tags": ["test", "hyrox", "aerobic"], "special": "comp", "html": "<h4><b>Mobility &amp; Activation<\/b><\/h4><p><b>5 min Backwards Walking<\/b><br>Activate knees, ankles, and hips. Keep posture tall and steps controlled.<\/p><hr><h4><b>Running Drills<\/b><\/h4><p><b>Marching Mechanics:<\/b><\/p><ul><li><p><b>A-Skips<\/b> – Focus on rhythm, posture, and foot strike<\/p><\/li><li><p><b>B-Skips<\/b> – Add range and drive. Keep it snappy and fluid<\/p><\/li><li><p><b>Happy Hip Skips <\/b><\/p><\/li><\/ul><hr><h3><b>WORKOUT: Compromised Running Benchmark<\/b><\/h3><p><b>Focus:<\/b> Threshold effort + fatigue resistance under functional load<br>This benchmark tests your ability to maintain run pace under fatigue from sleds, jumps, and loaded lunges — simulating race conditions like Hyrox or OCR.<br><b>Scoring: Total Rounds + distance <\/b><br><b>Ex) If you complete 2 rounds and the sled push on third round, your score would be: 2+1037 (1000 m run + 37 m run) <\/b><\/p><hr><h4><b>Warm-Up<\/b><\/h4><p><b>4 Rounds at Zone 2 Effort:<\/b><\/p><ul><li><p>1 min Row<\/p><\/li><li><p>1 min Echo Bike<\/p><\/li><li><p>1 min Run<br><i>Keep breathing under control. The goal is to elevate heart rate and fire up aerobic system.<\/i><\/p><\/li><\/ul><hr><h4><b>Main Set – For Rounds<\/b><\/h4><p><b>Compromised Running Benchmark<\/b><\/p><ol><li><p><b>1000m Run<\/b><\/p><\/li><li><p><b>37m Sled Push @ Hyrox Weight<\/b><\/p><\/li><li><p><b>1000m Run<\/b><\/p><\/li><li><p><b>50m Burpee Broad Jump (BBJ)<\/b><\/p><\/li><li><p><b>1000m Run<\/b><\/p><\/li><li><p><b>50m Walking Lunges @ Hyrox Competition Weight<\/b><\/p><\/li><\/ol><ul><li><p><b>Cap: 45 minutes<\/b> or stop if your pace slows <b>more than 10 seconds/km off goal pace<\/b><\/p><\/li><\/ul><hr><h4><b>Cool-Down<\/b><\/h4><p><b>10–15 min Easy Aerobic Work<\/b><br>Jog, walk, or light cardio. Let the heart rate come down and finish with light mobility or stretching.<\/p>"}, {"id": 2496637, "di": 6, "day": "Sunday", "title": "Mobility & Rest", "tags": ["mobility"], "html": "<p><b>Focus:<\/b> Joint prep + full-body flexibility<br>This mobility session combines joint circles and controlled movement with static stretching to help you move better, recover faster, and reduce injury risk. Ideal pre- or post-run.<\/p><hr><h4><b>Joint Mobility (Joint Prep)<\/b><\/h4><p>Move slowly and intentionally through each:<\/p><ul><li><p><b>Foot Roll<\/b> – Use a lacrosse ball or roller to release the arch<\/p><\/li><li><p><b>Ankle Roll (Out/In/Back)<\/b> – Gentle, controlled circles in all directions<\/p><\/li><li><p><b>Hip Roll<\/b> – Big, slow hip circles to open the joint<\/p><\/li><li><p><b>Knee Roll<\/b> – Small circular movements to wake up the knees<\/p><\/li><li><p><b>Front Hip Roll<\/b> – Focus on forward flexion and control<\/p><\/li><\/ul><hr><h4><b>Static Stretching<\/b><\/h4><p>Hold each stretch for 60 seconds, breathing deeply throughout:<\/p><ul><li><p><b>Lying Pec Stretch<\/b> – Open the chest and shoulders<\/p><\/li><li><p><b>Butterfly Stretch<\/b> – Groin and inner thighs<\/p><\/li><li><p><b>90/90 Stretch<\/b> – Hips and glutes<\/p><\/li><li><p><b>Pigeon Pose<\/b> – Deep external hip stretch; relax into the hold<\/p><\/li><\/ul><hr><p><b>Take your time. This session is about feeling better and moving better.<\/b><\/p><hr><h3><b>WORKOUT: Easy Run<\/b><\/h3><p><b>Focus:<\/b> Aerobic base + running mechanics<br>This run builds your endurance engine while reinforcing smooth, efficient form. The goal here isn’t speed — it’s <i>consistency and control<\/i>.<\/p><hr><h4><b>Main Set<\/b><\/h4><p><b>40–50 min Easy Effort @ Zone 2 / Low Zone 3<\/b><\/p><ul><li><p>Settle into a pace that feels sustainable and relaxed<\/p><\/li><li><p>You should be able to talk in full sentences — no gasping<\/p><\/li><\/ul><p><b>Coaching Tips:<\/b><\/p><ul><li><p><b>Faster is not better<\/b> — this is about refining your mechanics, not chasing pace<\/p><\/li><li><p>Focus on <b>posture, breath, and rhythm<\/b><\/p><\/li><li><p>Run tall, land softly, and move smoothly<\/p><\/li><\/ul>"}, {"id": 3409756, "di": 6, "day": "Sunday", "title": "Sunday Recap – Week 1: Goals", "tags": ["recap"], "recap": {"prompt": "What do you want your running to feel more like by the end of this program?", "sub": "", "example": "I want my running to feel calmer and more controlled, especially when I’m a little fatigued. Less forcing, more rhythm."}}]}, {"n": 2, "label": "W2", "name": "Week 2", "sessions": [{"id": 2496663, "di": 0, "day": "Monday", "title": "Running Strength Day", "tags": ["strength"], "html": "<p><b>Focus:<\/b> Eccentric control, explosive power, and full-body resilience<br>This session is designed to improve joint durability, strength, and power — all essential to running well and staying injury-free. You’ll move through tempo lifts, plyometrics, and classic strength work, with an optional aerobic finisher to round it out.<\/p><hr><h4><b>Prep &amp; Joint Strength<\/b><\/h4><p><b><a href=\"https://youtu.be/RUXLuZ_GLrE\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Heels-Elevated Squat<\/a><\/b><b> – Tempo 4/2/1/1<\/b><br>Use a controlled 4-second descent, 2-second pause at the bottom, 1-second rise, and 1-second pause at the top.<\/p><p><b><a href=\"https://youtu.be/pz70FwVRDJE\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Tibialis Raise<\/a><\/b><b> – 1x30<\/b><br>Slow and controlled. Focus on activation through the shins.<\/p><p><b><a href=\"https://youtu.be/CufVyiLj878\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Calf Raise<\/a><\/b><b> – 1x20–30 Each Leg<\/b><br>Pause at the top, lower with control. Train full range.<\/p><p><b><a href=\"https://youtu.be/AzbtpwYr2So\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Poliquin Step-Up<\/a><\/b><b> – 2x20<\/b><br>Heel elevated. Drive knee forward over toes. Keep balance and posture tight.<\/p><p><b><a href=\"https://youtu.be/KmfmXwvdwVU\" target=\"_blank\" rel=\"noopener\" class=\"vid\">ATG Lunges<\/a><\/b><b> – 3x10 Each Leg<\/b><br>Controlled, deep range of motion. Heel stays down, chest tall.<\/p><hr><h4><b>Super Set – 3 Rounds<\/b><\/h4><ul><li><p><b><a href=\"https://youtu.be/_t9edkC6aa0\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Calf Isometric Hold <\/a><\/b><b>– 3 sec<\/b> at top position<\/p><\/li><li><p><b><a href=\"https://youtu.be/YGlAdtSKQaU\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Jefferson Curl<\/a><\/b><b> – 3 reps<\/b> slow and smooth, full spinal articulation<\/p><\/li><\/ul><hr><h4><b>Power &amp; Plyometrics<\/b><\/h4><p><b>Sled Push – 1x50m<\/b><br>Steady and unbroken. Focus on posture and drive.<\/p><p><b><a href=\"https://www.youtube.com/shorts/ak8BTDZJd7M\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Single-Leg Broad Jump<\/a><\/b><b> – 3x2 Each Leg<\/b><br>Stick each landing. Focus on power and body control.<\/p><p><b><a href=\"https://youtu.be/j260zYfRz8Q\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Standing Vertical Jump<\/a><\/b><b> – 3x2<\/b><br>Reset between reps. Max height with clean form.<\/p><hr><h4><b>Main Lift<\/b><\/h4><p><b>Deadlift – 3x3 @ 85–90%<\/b><br>Move heavy with good form. Braced core, smooth bar path.<br><i>Rest 90–120 seconds between sets<\/i><\/p><hr><h4><b>Strength Super Set – 3 Rounds<\/b><\/h4><ul><li><p><b>Heels-Elevated Goblet Squat – x15<\/b><\/p><\/li><li><p><b>Pull-Up – x2 RIR (Reps in Reserve)<\/b><br>Control each rep. Use assistance if needed.<br><i>Rest 60 seconds between rounds<\/i><\/p><\/li><\/ul><hr><h4><b>Accessory Finisher<\/b><\/h4><ul><li><p><b>Toes-to-Bar – x2 RIR<\/b><\/p><\/li><li><p><b>Push-Ups – x2 RIR<\/b><br>Finish strong with clean, efficient reps. Form over volume.<\/p><\/li><\/ul><hr><h3><b>AEROBIC OPTION<\/b> <i>(Add-on or Standalone)<\/i><\/h3><p><b>4 Rounds:<\/b><\/p><ul><li><p><b>3 min Row<\/b><\/p><\/li><li><p><b>3 min Ski<\/b><\/p><\/li><li><p><b>3 min Bike or Run<\/b><\/p><\/li><\/ul><p>Stay in <b>Zone 2<\/b> — smooth, steady, and sustainable effort. Great for base building or active recovery.<\/p>"}, {"id": 2496664, "di": 1, "day": "Tuesday", "title": "Threshold", "tags": ["threshold"], "html": "<p><b>Focus:<\/b> Joint prep + running mechanics<br>This session gets your body ready for quality running with mobility work and fundamental running drills to improve posture, coordination, and rhythm.<\/p><hr><h4><b>Prep Warm-Up<\/b><\/h4><p><b>5 min Backwards Walking<\/b><br>Activate knees, ankles, and hips. Stay tall, controlled, and steady.<\/p><p><b>Happy Hip Flow<\/b><br>Work through deep lunges, rotations, and hip openers to improve range and movement quality.<\/p><hr><h4><b>Running Drills<\/b><\/h4><ul><li><p><b>A-Skips<\/b> – Drive the knee up, land softly under your center<\/p><\/li><li><p><b>B-Skips<\/b> – Add extension through the leg for rhythm and range<br><i>Keep posture tall and arms engaged throughout.<\/i><\/p><\/li><\/ul><hr><h3><b>WORKOUT: Threshold with Float<\/b><\/h3><p><b>Focus:<\/b> Threshold running + aerobic recovery control<br>This workout builds aerobic power while teaching you how to manage effort and maintain form under fatigue. \"Float\" recoveries challenge you to stay in control even between hard efforts.<\/p><hr><h4><b>Warm-Up<\/b><\/h4><p><b>10–15 min Easy Aerobic Run<\/b><br>Smooth, steady effort in Zone 2 — you should finish feeling better than when you started.<\/p><p><b>4 x 100m Strides @ 90% effort<\/b><\/p><ul><li><p>Fast but controlled, with <b>perfect running form<\/b><\/p><\/li><li><p>Rest 60 seconds between each<\/p><\/li><li><p>Think tall posture, quick turnover, light ground contact<\/p><\/li><\/ul><hr><h4><b>Main Set<\/b><\/h4><p><b>4–6 x 800m @ Threshold Pace (Zone 4 HR)<\/b><\/p><ul><li><p>Recover with a <b>200m float<\/b> after each rep<\/p><ul><li><p>A <b>float<\/b> = your typical Zone 2 running pace — not a slow jog<\/p><\/li><li><p>You’re still running, just backing off the gas<\/p><\/li><\/ul><\/li><\/ul><p><i>Each 800m should feel strong and steady — not a sprint, but definitely outside your comfort zone.<\/i><\/p><hr><h4><b>Cool-Down<\/b><\/h4><p><b>10–15 min Easy Aerobic Run<\/b><br>Bring the heart rate down gradually. Use this time to settle your breathing and flush the legs.<\/p>"}, {"id": 2496665, "di": 2, "day": "Wednesday", "title": "Mobility", "tags": ["mobility"], "html": "<p><b>Focus:<\/b> Joint health, range of motion, and recovery<br>This mobility session blends Kruse-style joint articulation with static stretching to keep your body moving well and feeling good — whether you’re prepping for a run or winding down post-session.<\/p><hr><h4><b>Joint Prep<\/b><\/h4><p>Move slowly and with intention:<\/p><ul><li><p><b>Foot Roll<\/b> – Use a ball to release the arch and heel<\/p><\/li><li><p><b>Ankle Roll – Out / In / Back<\/b> – Circle the ankle in all directions<\/p><\/li><li><p><b>Hip Roll<\/b> – Big controlled circles, both directions<\/p><\/li><li><p><b>Knee Roll<\/b> – Gentle movement to mobilize the joint<\/p><\/li><li><p><b>Front Hip Roll<\/b> – Focus on forward movement and control<\/p><\/li><\/ul><hr><h4><b>Static Stretching<\/b><\/h4><p>Hold each stretch for 30–60 seconds and breathe deeply:<\/p><ul><li><p><b>Pec Stretch<\/b> – Open the chest and shoulders<\/p><\/li><li><p><b>Lat Stretch (Prayer Stretch)<\/b> – Hips back, arms extended<\/p><\/li><li><p><b>Couch Stretch<\/b> – Target hip flexors and quads<\/p><\/li><li><p><b>Knight Stretch<\/b> – Groin, hips, and hamstrings<\/p><\/li><li><p><b>Pigeon Pose<\/b> – Deep hip and glute release<\/p><\/li><\/ul><hr><p><b>Use this session as a stand-alone recovery piece or as part of your warm-up or cool-down routine.<\/b><\/p><hr><h3><b>WORKOUT: Mechanical Fartlek<\/b><\/h3><p><b>Focus:<\/b> Running efficiency + aerobic development<br>This structured fartlek run improves running form and pacing while staying entirely in Zone 2. It's all about smooth, efficient movement — not speed.<\/p><hr><h4><b>Main Set: 32–40 Minutes<\/b><\/h4><p>Alternate every 2 minutes:<\/p><ul><li><p><b>2 min Uptempo<\/b> (with perfect form)<\/p><ul><li><p>Controlled effort with <b>HR cap at 180 – your age<\/b> <i>or<\/i> ~75% of your max HR<\/p><\/li><\/ul><\/li><li><p><b>2 min Slower<\/b> (still perfect form, just 10–20 sec/mile slower)<\/p><ul><li><p>Active recovery, not lazy running<\/p><\/li><\/ul><\/li><\/ul><p><b>Coaching Tips:<\/b><\/p><ul><li><p>Focus on posture, foot strike, and breathing<\/p><\/li><li><p>Both paces should stay <b>within Zone 2<\/b><\/p><\/li><li><p>Faster ≠ better — smoother is better<\/p><\/li><\/ul>"}, {"id": 2496666, "di": 3, "day": "Thursday", "title": "Hybrid Running & Strength Series", "tags": ["strength"], "html": "<p><b>Focus:<\/b> Joint mobility and running mechanics<br>This session gets your body prepped for quality movement by opening up key joints and dialing in coordination.<\/p><hr><h4><b>Prep Warm-Up<\/b><\/h4><p><b>5 min Backwards Walking<\/b><br>Activate the knees, hips, and ankles. Stay upright and smooth.<\/p><p><b>Happy Hip Flow<\/b><br>Work through deep lunges, hip circles, and mobility drills to loosen up and increase range.<\/p><hr><h4><b>Running Drills<\/b><\/h4><ul><li><p><b>A-Skips<\/b> – Focus on posture, rhythm, and knee drive<\/p><\/li><li><p><b>B-Skips<\/b> – Add leg extension for range and control<br>Keep your movements clean and snappy. These drills reinforce proper running form.<\/p><\/li><\/ul><hr><h3><b>WORKOUT: Hill Sprints<\/b><\/h3><p><b>Focus:<\/b> Power, posture, and sprint mechanics<br>Hill sprints build explosive strength, improve running form, and reduce impact. Think quick turnover, tall posture, and controlled aggression.<\/p><hr><h4><b>Warm-Up<\/b><\/h4><p><b>10–15 min Easy Aerobic Run<\/b> (to a hill)<br>Keep it light. The goal is to get warm and ready to sprint — not fatigued.<\/p><hr><h4><b>Main Set<\/b><\/h4><p><b>5 x 30-Second Hill Sprints<\/b><\/p><ul><li><p>Build to a fast, <i>near-sprint<\/i> pace — be explosive, but stay safe<\/p><\/li><li><p>Walk or <b>jog to the bottom<\/b> for recovery between each rep<\/p><\/li><li><p>Focus on strong arm drive, tall chest, and quick turnover<\/p><\/li><\/ul><hr><h4><b>Cool-Down<\/b><\/h4><p><b>20–30 min Easy Aerobic Run<\/b><br>Settle back into a relaxed pace. Use this time to recover while still moving.<\/p><p><b>Coaching Tip:<\/b><br>These sprints are high quality, not reckless. Speed is great — form is better.<\/p><hr><h3><b>WORKOUT: Running Strength Day<\/b><\/h3><p><b>Focus:<\/b> Eccentric control, power output, and total-body strength<br>This session is designed to make you stronger, more explosive, and more durable. You’ll train with control, then add in movement that transfers directly to running.<\/p><hr><h4><b>Joint Prep &amp; Control<\/b><\/h4><p><b><a href=\"https://youtu.be/RUXLuZ_GLrE\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Heels-Elevated Squat<\/a><\/b><b> – Tempo 4/2/1/1<\/b><br>Use a controlled 4-second descent, 2-second pause at the bottom, 1-second rise, and 1-second pause at the top.<\/p><p><b><a href=\"https://youtu.be/pz70FwVRDJE\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Tibialis Raise<\/a><\/b><b> – 1x30<\/b><br>Slow and controlled. Focus on activation through the shins.<\/p><p><b><a href=\"https://youtu.be/CufVyiLj878\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Calf Raise<\/a><\/b><b> – 1x20–30 Each Leg<\/b><br>Pause at the top, lower with control. Train full range.<\/p><p><b><a href=\"https://youtu.be/AzbtpwYr2So\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Poliquin Step-Up<\/a><\/b><b> – 2x20<\/b><br>Heel elevated. Drive knee forward over toes. Keep balance and posture tight.<\/p><p><b><a href=\"https://youtu.be/KmfmXwvdwVU\" target=\"_blank\" rel=\"noopener\" class=\"vid\">ATG Lunges<\/a><\/b><b> – 3x10 Each Leg<\/b><br>Controlled, deep range of motion. Heel stays down, chest tall.<\/p><hr><h4><b>Super Set – 3 Rounds<\/b><\/h4><ul><li><p><b><a href=\"https://youtu.be/_t9edkC6aa0\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Calf Isometric Hold <\/a><\/b><b>– 3 sec<\/b> at top position<\/p><\/li><li><p><b><a href=\"https://youtu.be/YGlAdtSKQaU\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Jefferson Curl<\/a><\/b><b> – 3 reps<\/b> slow and smooth, full spinal articulation<\/p><\/li><\/ul><hr><h4><b>Power &amp; Plyo<\/b><\/h4><p><b><a href=\"https://youtu.be/k7JsvdG9sSo\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Sled Drag<\/a><\/b><b> – 1x50m<\/b><br>Steady and unbroken. Stay low and drive through your legs.<\/p><p><b><a href=\"https://youtu.be/LDU_yVvp7pA\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Single-Leg Box Jump<\/a><\/b><b> – 3x2 each leg<\/b><br>Use stacked plates or a very low box. Focus on balance and control.<\/p><p><b><a href=\"https://youtu.be/uhz-ia-2UcM\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Standing Broad Jump<\/a><\/b><b> – 3x2<\/b><br>Explosive takeoff, soft landing. Reset between reps.<\/p><hr><h4><b>Main Strength Lift<\/b><\/h4><p><b><a href=\"https://youtu.be/U5Q5HfUyy78\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Barbell Reverse Lunge<\/a><\/b><b> – 3x5 Each Leg<\/b><br>Controlled and stable. Don’t rush.<br><i>Rest 90–120 seconds between sets<\/i><\/p><hr><h4><b>Strength Super Set – 3 Rounds<\/b><\/h4><ul><li><p><b><a href=\"https://youtu.be/pUdIL5x0fWg\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Hip Thrusts<\/a><\/b><b> – x10<\/b><\/p><\/li><li><p><b><a href=\"https://youtu.be/_aISMzimYEA\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Strict Press<\/a><\/b><b> – x10<\/b><br>Upper body + posterior chain. Keep reps clean.<br><i>Rest 60 seconds between rounds<\/i><\/p><\/li><\/ul><hr><h4><b>Accessory Finisher<\/b><\/h4><ul><li><p><b><a href=\"https://youtu.be/drtWxWK8QOM\" target=\"_blank\" rel=\"noopener\" class=\"vid\">GHD Sit-Ups<\/a><\/b><b> – x10<\/b> <i>(or 30 crunches)<\/i><\/p><\/li><li><p><b><a href=\"https://youtu.be/Hh3EFRiRobc\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Single Arm Farmer’s Carry<\/a><\/b><b> – 50m @ heavy<\/b><br>One arm at a time. Stay tall and stable. Don’t lean.<\/p><\/li><\/ul>"}, {"id": 2496668, "di": 4, "day": "Friday", "title": "Rest", "tags": ["rest"], "html": ""}, {"id": 2496669, "di": 5, "day": "Saturday", "title": "HYROX Running", "tags": ["hyrox"], "html": "<p><i>Build power. Move better. Run stronger.<\/i><br>This series blends smart prep, strong mechanics, and hybrid intensity — designed to help you crush miles and movements with confidence.<\/p><hr><h3><b>SESSION: Prep<\/b><\/h3><p><b>Focus:<\/b> Joint mobility + running mechanics<br>This warm-up sequence gets your body ready for high-output hybrid work — opening up the hips, reinforcing posture, and priming your stride.<\/p><hr><h4><b>Mobility &amp; Movement Prep<\/b><\/h4><p><b>5 min Backwards Walking<\/b><br>Wake up the knees, ankles, and hips. Move slowly and stay upright.<\/p><p><b>Happy Hip Flow<\/b><br>Move through deep lunges and rotations to open the hips and prep for dynamic motion.<\/p><hr><h4><b>Running Drills<\/b><\/h4><ul><li><p><b>A-Skips<\/b> – Knee drive, rhythm, and posture<\/p><\/li><li><p><b>B-Skips<\/b> – Extension and coordination<br><i>Control the movement. These drills sharpen your stride mechanics before hitting intensity.<\/i><\/p><\/li><\/ul><hr><h3><b>SESSION: HYROX Tempo<\/b><\/h3><p><b>Focus:<\/b> Hybrid conditioning at sustained effort<br>This session blends tempo running with machine work and movement stations — all under sustained aerobic load. Perfect for developing pacing and muscular endurance under fatigue.<\/p><hr><h4><b>Warm-Up<\/b><\/h4><p><b>10–15 min Easy Aerobic Run<\/b><br>Zone 2 effort. Settle in and get the engine warm.<\/p><p><b>4 x 100m Strides @ 90% effort<\/b><\/p><ul><li><p>Smooth acceleration with perfect running form<\/p><\/li><li><p>Rest 60 seconds between each<\/p><\/li><\/ul><hr><h4><b>Main Set<\/b><\/h4><p><b>35-Minute AMRAP<\/b> <i>(As Many Rounds As Possible)<\/i><br>Move smoothly and efficiently through the following:<\/p><p><b>Round 1:<\/b><\/p><ul><li><p>800m Run<\/p><\/li><li><p>300m Ski<\/p><\/li><li><p>25m Burpee Broad Jump<\/p><\/li><\/ul><p><b>Round 2:<\/b><\/p><ul><li><p>800m Run<\/p><\/li><li><p>300m Row<\/p><\/li><li><p>20 Wall Balls<\/p><\/li><\/ul><p>Repeat as many rounds as possible in 35 minutes.<\/p><p><b>Coaching Tips:<\/b><\/p><ul><li><p>Keep transitions tight but not frantic<\/p><\/li><li><p>Maintain a strong aerobic rhythm — this is <i>tempo<\/i>, not sprint<\/p><\/li><li><p>Find your pace and hold it<\/p><\/li><\/ul><hr><h4><b>Cool-Down<\/b><\/h4><p><b>10–15 min Easy Aerobic Movement<\/b><br>Run, bike, walk — your choice. Just move, breathe, and let the heart rate come down.<\/p>"}, {"id": 2496670, "di": 6, "day": "Sunday", "title": "Mobility", "tags": ["mobility"], "html": "<p><i>Unlock range. Restore motion. Move better.<\/i><br>This full-body mobility session blends joint articulation with deep static stretches to support recovery, movement prep, or your daily maintenance work.<\/p><hr><h4><b>Kruse Joint Roll Sequence<\/b><\/h4><p>Move slowly and with control to gently mobilize joints:<\/p><ul><li><p><b>Foot Roll<\/b><\/p><\/li><li><p><b>Ankle Roll – Out / In / Back<\/b><\/p><\/li><li><p><b>Hip Roll<\/b><\/p><\/li><li><p><b>Knee Roll<\/b><\/p><\/li><li><p><b>Front Hip Roll<\/b><\/p><\/li><\/ul><hr><h4><b>Static Stretch Series<\/b><\/h4><p>Hold each stretch for 30–60 seconds and breathe deeply:<\/p><ul><li><p><b>Standing Stretch<\/b> – Reach and open the chain<\/p><\/li><li><p><b>Laying Pec Stretch<\/b> – Open the chest and shoulders<\/p><\/li><li><p><b>Butterfly Stretch<\/b> – Inner thighs and hips<\/p><\/li><li><p><b>90/90<\/b> – External hip rotation and control<\/p><\/li><li><p><b>Pigeon Pose<\/b> – Deep glute and hip release<\/p><\/li><\/ul><hr><h3><b>WORKOUT TITLE: Easy Run + Aerobic Flush<\/b><\/h3><p><i>Relaxed endurance effort with a soft bike finish — smooth, not fast.<\/i><\/p><hr><h4><b>Run<\/b><\/h4><p><b>45–55 min Easy Effort<\/b><br>Stay in Zone 2 or low Zone 3. Think: conversational pace, tall posture, light ground contact.<br>This is all about aerobic volume and quality movement — <b>faster is not better.<\/b><\/p><hr><h4><b>Flush Bike<\/b><\/h4><p><b>20 min Easy Spin<\/b><br>Low resistance. Let the legs relax and recover. Spin it out while keeping breathing smooth and steady.<\/p>"}, {"id": 3409762, "di": 6, "day": "Sunday", "title": "Sunday Recap – Week 2: Habits", "tags": ["recap"], "recap": {"prompt": "What helped you stay consistent with your training this week?", "sub": "", "example": "Running earlier in the day helped a lot. Once it was done, it didn’t compete with the rest of training or life."}}]}, {"n": 3, "label": "W3", "name": "Week 3", "sessions": [{"id": 2496729, "di": 0, "day": "Monday", "title": "Running Strength Day", "tags": ["strength"], "html": "<p><i>Build elastic strength, control, and explosive coordination — all in service of better running.<\/i><\/p><hr><h4><b>Joint Prep + Stability Work<\/b><\/h4><p><b><a href=\"https://youtu.be/RUXLuZ_GLrE\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Heels-Elevated Squat<\/a><\/b><b> – Tempo 4/2/1/1<\/b><br>Use a controlled 4-second descent, 2-second pause at the bottom, 1-second rise, and 1-second pause at the top.<\/p><p><b><a href=\"https://youtu.be/pz70FwVRDJE\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Tibialis Raise<\/a><\/b><b> – 1x30<\/b><br>Slow and controlled. Focus on activation through the shins.<\/p><p><b><a href=\"https://youtu.be/CufVyiLj878\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Calf Raise<\/a><\/b><b> – 1x20–30 Each Leg<\/b><br>Pause at the top, lower with control. Train full range.<\/p><p><b><a href=\"https://youtu.be/AzbtpwYr2So\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Poliquin Step-Up<\/a><\/b><b> – 2x20<\/b><br>Heel elevated. Drive knee forward over toes. Keep balance and posture tight.<\/p><p><b><a href=\"https://youtu.be/KmfmXwvdwVU\" target=\"_blank\" rel=\"noopener\" class=\"vid\">ATG Lunges<\/a><\/b><b> – 3x10 Each Leg<\/b><br>Controlled, deep range of motion. Heel stays down, chest tall.<\/p><hr><h4><b>Super Set – 3 Rounds<\/b><\/h4><ul><li><p><b><a href=\"https://youtu.be/_t9edkC6aa0\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Calf Isometric Hold <\/a><\/b><b>– 3 sec<\/b> at top position<\/p><\/li><li><p><b><a href=\"https://youtu.be/YGlAdtSKQaU\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Jefferson Curl<\/a><\/b><b> – 3 reps<\/b> slow and smooth, full spinal articulation<\/p><\/li><\/ul><hr><h4><b>Power &amp; Plyo<\/b><\/h4><p><b>Sled Push – 1x50m @ steady and unbroken<\/b><br>Full-body tension. Smooth acceleration.<\/p><p><b><a href=\"https://www.youtube.com/shorts/ak8BTDZJd7M\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Single-Leg Broad Jump<\/a><\/b><b> – 3x2 Each Leg<\/b><br>Stick each landing. Focus on power and body control.<\/p><p><b><a href=\"https://youtu.be/j260zYfRz8Q\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Standing Vertical Jump<\/a><\/b><b> – 3x2<\/b><br>Reset between reps. Max height with clean form.<\/p><hr><h4><b>Strength Movement<\/b><\/h4><p><b>Deadlift – 4x4 @ 65–70%<\/b><br><i>Move with speed and control — this is not a grind.<\/i><br>Rest 90–120 seconds between sets.<\/p><hr><h4><b>Super Set – 3 Rounds<\/b><\/h4><ul><li><p><b>Heels Elevated Goblet Squat – x20<\/b><\/p><\/li><li><p><b>Pull-ups – x2 RIR<\/b> <i>(Reps In Reserve)<\/i><br>Rest as needed between rounds.<\/p><\/li><\/ul><hr><h4><b>Accessory Finisher<\/b><\/h4><ul><li><p><b>Toes to Bar – x2 RIR<\/b><\/p><\/li><li><p><b>Push-ups – x2 RIR<\/b><\/p><\/li><\/ul><hr><h3><b>AEROBIC OPTION: Cross-Modal Conditioning<\/b><\/h3><p><i>If you’re not hitting strength today — hit this instead.<\/i><\/p><p><b>5 Rounds:<\/b><\/p><ul><li><p><b>3 min Row<\/b><\/p><\/li><li><p><b>3 min Ski<\/b><\/p><\/li><li><p><b>3 min Bike or Run<\/b><\/p><\/li><\/ul><p>Stay aerobic. Focus on breathing, posture, and consistency across rounds.<\/p>"}, {"id": 2496730, "di": 1, "day": "Tuesday", "title": "Threshold with Float", "tags": ["threshold"], "html": "<p><i>Aerobic power meets running discipline — controlled discomfort with purposeful recovery.<\/i><\/p><hr><h4><b>Prep<\/b><\/h4><p><b>5 min Backwards Walking<\/b><br>Wake up the knees, hips, and calves. Stay tall, smooth, and steady.<\/p><p><b>Happy Hip Flow<\/b><br>Dynamic hip openers to prep the joints and increase mobility.<\/p><p><b>Marching + Running Drills<\/b><\/p><ul><li><p><b>A-Skips<\/b> – Drive the knee, keep posture tall<\/p><\/li><li><p><b>B-Skips<\/b> – Add extension and range<br><i>Focus on rhythm, light contact, and upright mechanics.<\/i><\/p><\/li><\/ul><hr><h4><b>Warm-Up<\/b><\/h4><p><b>10–15 min Easy Aerobic Run<\/b><br>Zone 2 effort — relaxed and smooth.<\/p><p><b>4 x 100m Strides @ ~90% effort<\/b><br>Build speed while maintaining perfect form.<br><i>Rest 60 seconds between each.<\/i><\/p><hr><h4><b>Main Set<\/b><\/h4><p><b>Block 1 – Threshold Repeats<\/b><br><b>2–3 x 1000m @ Threshold (Z4 HR)<\/b><\/p><ul><li><p><b>200m Float Recovery<\/b> <i>(run at normal Z2 pace, not a jog)<\/i><\/p><\/li><\/ul><p><b>2 min Rest (non-running)<\/b><br>Walk or stand. Breathe. Reset your system.<\/p><p><b>Block 2 – Threshold Repeats<\/b><br><b>2–3 x 1000m @ Threshold (Z4 HR)<\/b><\/p><ul><li><p><b>200m Float Recovery<\/b> <i>(hold form and aerobic rhythm)<\/i><\/p><\/li><\/ul><hr><h4><b>Cool-Down<\/b><\/h4><p><b>10–15 min Easy Aerobic Run<\/b><br>Let your heart rate come down. Focus on soft steps and smooth mechanics.<\/p><hr><p><b>Coaching Tip:<\/b><br>“Float” doesn’t mean shuffle. Your float pace should look and feel like a normal Zone 2 run. Mastering this recovery is just as important as the work intervals.<\/p>"}, {"id": 2496732, "di": 2, "day": "Wednesday", "title": "Mobility + Static Stretch", "tags": ["mobility"], "html": "<p><i>Open it up. Recover well. Move better tomorrow.<\/i><br>This blend of Kruse-style joint articulation and static holds supports recovery, flexibility, and movement efficiency. Do it post-run, post-lift, or on its own.<\/p><hr><h4><b>Joint Roll Sequence<\/b><\/h4><p>Move slowly with control:<\/p><ul><li><p><b>Foot Roll<\/b><\/p><\/li><li><p><b>Ankle Roll – Out / In / Back<\/b><\/p><\/li><li><p><b>Hip Roll<\/b><\/p><\/li><li><p><b>Knee Roll<\/b><\/p><\/li><li><p><b>Front Hip Roll<\/b><\/p><\/li><\/ul><hr><h4><b>Static Stretch Series<\/b><\/h4><p>Hold each stretch for 30–60 seconds:<\/p><ul><li><p><b>Pec Stretch<\/b><\/p><\/li><li><p><b>Lat Stretch (Prayer)<\/b><\/p><\/li><li><p><b>Couch Stretch<\/b><\/p><\/li><li><p><b>Knight Stretch<\/b><\/p><\/li><li><p><b>Pigeon Pose<\/b><\/p><\/li><\/ul><hr><h3><b>WORKOUT TITLE: Mechanical Fartlek<\/b><\/h3><p><i>Form-focused aerobic run to build rhythm, control, and capacity — without ever leaving Zone 2.<\/i><\/p><hr><h4><b>Main Set – 35–40 min Continuous<\/b><\/h4><p>Alternate intervals:<\/p><ul><li><p><b>3 min Uptempo<\/b> (smooth, controlled effort with perfect form)<\/p><ul><li><p><b>Cap HR at 180 – your age<\/b> (or ~75% max HR)<\/p><\/li><\/ul><\/li><li><p><b>2 min Slower<\/b> (10–20 seconds/mile slower — still perfect form)<\/p><\/li><\/ul><p><b>Important:<\/b><\/p><ul><li><p>Stay entirely in Zone 2<\/p><\/li><li><p>Focus on posture, breathing, and quiet, light steps<\/p><\/li><li><p>Run tall. Run smooth. Run smart.<\/p><\/li><\/ul><hr><h3><b>AEROBIC OPTION: 30-Min Cycling<\/b><\/h3><p>Low-impact, aerobic flush session<br>Stay in Zone 2, focus on even cadence, relaxed shoulders, and full pedal strokes.<\/p>"}, {"id": 2496733, "di": 3, "day": "Thursday", "title": "Flat Speed + Running Strength", "tags": ["speed", "strength"], "html": "<p><i>A double-header day: sharpen top-end speed with clean mechanics, then layer in strength and plyos to build resilience and explosiveness.<\/i><\/p><hr><h4><b>Prep<\/b><\/h4><p><b>5 min Backwards Walking<\/b><br>Activate and prep the posterior chain with control.<\/p><p><b>Happy Hip Flow<\/b><br>Open the hips dynamically for range and rotation.<\/p><p><b>Running Drills:<\/b><\/p><ul><li><p><b>A-Skips<\/b> – For knee drive and upright posture<\/p><\/li><li><p><b>B-Skips<\/b> – Add extension, control, and timing<br><i>Do these with rhythm and intention — set the tone for the rest of the session.<\/i><\/p><\/li><\/ul><hr><h3><b>WORKOUT TITLE: Flat Speed<\/b><\/h3><p><i>Top-end speed without sacrificing form. Sprinting in distance gear — fast, tall, and smooth.<\/i><\/p><hr><h4><b>Warm-Up<\/b><\/h4><p><b>10–15 min Easy Aerobic Run<\/b><br>Zone 2 cruise to get the system online.<\/p><p><b>4 x 100m Strides @ ~90%<\/b><br>Fast but relaxed. Maintain posture and perfect distance running form.<br><i>Rest 60 sec between reps.<\/i><\/p><hr><h4><b>Main Set<\/b><\/h4><p><b>4 x 200m @ Fastest Distance Form<\/b><br>Not sprinting — fast <i>within<\/i> your form limits.<br>Rest 2 minutes between reps.<\/p><p><b>2 x 150m @ Same Focus<\/b><br>Keep ground contact light. Drive with hips.<br>Rest 2 minutes between reps.<\/p><hr><h4><b>Cool-Down<\/b><\/h4><p><b>10–15 min Easy Jog<\/b><br>Zone 2 effort. Let the body recover and flush out.<\/p><hr><p><b>Coaching Tips:<\/b><br>The goal is max speed <i>with distance form.<\/i><br>Avoid full sprint mechanics — once your form breaks or becomes “sprinter-like,” you’re going too fast. This teaches efficient turnover without sacrificing economy.<\/p><hr><h3><b>WORKOUT TITLE: Running Strength Day<\/b><\/h3><p><i>Functional strength with a run-forward focus — build capacity, power, and control where it counts.<\/i><\/p><hr><h4><b>Strength &amp; Stability Work<\/b><\/h4><p><b>Heels Elevated Eccentric Squat – 4/2/1/1 tempo<\/b><br>Control every phase. Light load, max intention.<\/p><p><b>Tibialis Raise – 1x30<\/b><br>Strengthen ankle stability and anterior chain.<\/p><p><b>Calf Raise – 1x20–30 each leg<\/b><br>Pause at the top. Control the drop.<\/p><p><b>Poliquin Step-Up – 2x20<\/b><br>Knee drive with tension. Keep posture upright.<\/p><p><b>ATG Lunge – 3x10<\/b><br>Long stride, heel down, knee past toe.<\/p><hr><h4><b>Super Set – 3 Rounds<\/b><\/h4><ul><li><p><b>Calf Isometric – 3x3 sec<\/b><\/p><\/li><li><p><b>Jefferson Curl – 3x3 reps<\/b> (full range spinal control)<\/p><\/li><\/ul><hr><h4><b>Power &amp; Explosive Work<\/b><\/h4><p><b>Sled Drag – 1x50m steady and unbroken<\/b><br>Focus on drive and posture.<\/p><p><b>Single Leg Box Jump – 3x2<\/b><br>Low box. Land soft. Reset each time.<\/p><p><b>Standing Broad Jump – 3x2<\/b><br>Explosive hip extension. Stick the landing.<\/p><hr><h4><b>Strength Movement<\/b><\/h4><p><b>Barbell Reverse Lunge – 3x5<\/b><br>Use a moderate load. Control each rep.<br><i>Rest 90–120 seconds.<\/i><\/p><hr><h4><b>Super Set – 3 Rounds<\/b><\/h4><ul><li><p><b>Hip Thrust – x10<\/b><\/p><\/li><li><p><b>Strict Press – x10<\/b><br><i>Rest 60 seconds between rounds.<\/i><\/p><\/li><\/ul><hr><h4><b>Accessory Finisher – 3 Rounds<\/b><\/h4><ul><li><p><b>GHD Sit-Up x10<\/b> <i>(or 30 V-Ups)<\/i><\/p><\/li><li><p><b>Single Arm Farmer’s Carry – 50m heavy<\/b><br>Walk tall. Core braced. No leaning.<\/p><\/li><\/ul>"}, {"id": 2496735, "di": 4, "day": "Friday", "title": "Rest", "tags": ["rest"], "html": ""}, {"id": 2496736, "di": 5, "day": "Saturday", "title": "Threshold w/ Machine Work", "tags": ["threshold", "hyrox"], "html": "<p><i>The ultimate combo: sustained aerobic intensity on foot and machine. Push threshold. Sharpen pacing. Expand capacity.<\/i><\/p><hr><h4><b>Prep<\/b><\/h4><p><b>5 min Backwards Walking<\/b><br>Activate the posterior chain and prep the knees/ankles.<\/p><p><b>Happy Hip Flow<\/b><br>Mobilize the hips for smoother stride mechanics.<\/p><p><b>Running Drills:<\/b><\/p><ul><li><p><b>A-Skips<\/b> – Rhythm + posture<\/p><\/li><li><p><b>B-Skips<\/b> – Add drive + extension<\/p><\/li><\/ul><hr><h4><b>Warm-Up<\/b><\/h4><p><b>10–15 min Easy Aerobic Run<\/b><br>Zone 2 effort. Let your body open up. Breathe deep.<\/p><p><b>4 x 100m Strides @ ~90% form sprint<\/b><br>Focus on smooth acceleration and proper distance form.<br><i>Rest 60 seconds between each.<\/i><\/p><hr><h4><b>Main Set<\/b><\/h4><p><b>3 x 1600m @ Threshold Pace (Z4 HR)<\/b><br>Maintain effort — not speed. Lock into rhythm.<br><i>Rest 60 seconds between reps.<\/i><\/p><p>→ Move directly into machine work:<\/p><p><b>5 x 400m Ski Erg @ Threshold<\/b><br><i>Rest 40 seconds between efforts.<\/i><\/p><p><b>5 x 400m Row @ Threshold<\/b><br><i>Rest 40 seconds between efforts.<\/i><\/p><hr><h4><b>Cool-Down<\/b><\/h4><p><b>10–15 min Easy Jog or Spin<\/b><br>Bring it down slowly. Focus on form and breathing.<\/p><hr><h4><b>Coaching Tips<\/b><\/h4><p>This session is best done on a treadmill or near ski/row stations for quick transitions.<br>Pace matters here — threshold should feel challenging but <b>repeatable.<\/b> Keep mechanics clean even as fatigue builds. RPE 7–8.<\/p>"}, {"id": 2496737, "di": 6, "day": "Sunday", "title": "Mobility + Easy Run & Bike Combo", "tags": ["aerobic", "mobility"], "html": "<p><i>A full-body reset meets aerobic volume. Recover well, move better, and build your base without pushing the redline.<\/i><\/p><hr><h4><b>Mobility (Kruse + Static Stretch)<\/b><\/h4><p>Loosen up, reset your joints, and release lingering tension.<\/p><p><b>Joint Rolls<\/b><\/p><p>Move slowly and intentionally through each:<\/p><ul><li><p><b>Foot Roll<\/b><\/p><\/li><li><p><b>Ankle Roll – Out / In / Back<\/b><\/p><\/li><li><p><b>Hip Roll<\/b><\/p><\/li><li><p><b>Knee Roll<\/b><\/p><\/li><li><p><b>Front Hip Roll<\/b><\/p><\/li><\/ul><p><b>Static Holds – 30–60s Each<\/b><\/p><ul><li><p><b>Standing Stretch<\/b><\/p><\/li><li><p><b>Laying Pec Stretch<\/b><\/p><\/li><li><p><b>Butterfly<\/b><\/p><\/li><li><p><b>90/90<\/b><\/p><\/li><li><p><b>Pigeon Pose<\/b><\/p><\/li><\/ul><hr><h3><b>WORKOUT TITLE: Easy Run + Bike Flush<\/b><\/h3><p><i>Time in the zone, not time on the gas.<\/i><\/p><hr><h4><b>Main Session<\/b><\/h4><p><b>50–55 min Easy Run<\/b><\/p><ul><li><p>Stay in Zone 2 or low Zone 3<\/p><\/li><li><p>Keep your cadence, posture, and breathing smooth<\/p><\/li><li><p>Think: \"sustainable and efficient\" — not \"fast\"<\/p><\/li><\/ul><p><b>Then:<\/b><br><b>20–25 min Easy Bike<\/b><\/p><ul><li><p>Spin out the legs<\/p><\/li><li><p>Maintain light tension and even cadence<\/p><\/li><li><p>Use this as active recovery, not additional workload<\/p><\/li><\/ul><hr><h4><b>Coaching Notes<\/b><\/h4><p>Faster is not better today. Easy effort = easy heart rate = aerobic adaptation.<br>Perfect form matters more than pace. Smooth is strong.<\/p>"}, {"id": 3409784, "di": 6, "day": "Sunday", "title": "Sunday Recap – Week 3: Recovery", "tags": ["recap"], "recap": {"prompt": "How did recovery affect how your runs felt this week?", "sub": "", "example": "When I slept well, I settled into runs much faster. On tired days, it took longer to find rhythm and control."}}]}, {"n": 4, "label": "W4", "name": "Week 4", "sessions": [{"id": 2496772, "di": 0, "day": "Monday", "title": "De-load Week – MAF Benchmark", "tags": ["test"], "special": "maf", "html": "<p><i>A low-stress, high-return aerobic test. This is all about control, pacing, and progress tracking — not performance pressure.<\/i><\/p><hr><h4><b>Prep<\/b><\/h4><p><b>5 min Backwards Walking<\/b><br>Fire up the posterior chain and prep your joints for running.<\/p><p><b>Running Drills:<\/b><\/p><ul><li><p><b>A-Skips<\/b><\/p><\/li><li><p><b>B-Skips<\/b><br>Focus on posture, rhythm, and light ground contact.<\/p><\/li><\/ul><hr><h3><b>MAF Benchmark – 5K Aerobic Test<\/b><\/h3><p><i>A repeatable baseline test for aerobic fitness and efficiency.<\/i><\/p><hr><h4><b>MAF Benchmark Test<\/b><\/h4><p><b>Aerobic Benchmark<\/b><\/p><p><b>15 min Easy Aerobic Warm-Up<\/b><\/p><ul><li><p>Run is preferred — the goal is to gradually bring your heart rate into your aerobic zone<\/p><\/li><\/ul><p><b>8K For Time @ MAF Heart Rate <\/b><\/p><ul><li><p>Use the formula <b>180 – your age<\/b> to find your estimated MAF heart rate<\/p><ul><li><p>If you know your heart rate zones, aim for the <b>middle of Zone 2<\/b><\/p><\/li><\/ul><\/li><li><p><b>The scoring starts once you hit your Target HR<\/b><\/p><\/li><li><p><b>Record your split every 1000m<\/b><\/p><\/li><\/ul><p><b>5K For Time @ MAF Heart Rate (Beginner)<\/b><\/p><p><b>10–15 min Easy Cool-Down<\/b><br>Bring the heart rate down gradually and stay relaxed. Easy jog or walk.<\/p><hr><h4><b>Cool-Down<\/b><\/h4><p><b>10–15 min Easy Jog or Walk<\/b><br>Bring your system back down gradually.<\/p><hr><h4><b>Coaching Tips<\/b><\/h4><ul><li><p>Focus on clean, efficient running form — especially as fatigue builds.<\/p><\/li><li><p>This is not an all-out effort. In fact, it might feel too slow — that’s okay.<\/p><\/li><li><p>MAF tests are about <i>progress at the same effort.<\/i><\/p><\/li><li><p>Don’t expect huge changes yet — consistency over time is the key.<\/p><\/li><\/ul>"}, {"id": 2496773, "di": 1, "day": "Tuesday", "title": "Running Strength Day + Aerobic", "tags": ["strength", "aerobic"], "html": "<p><i>Power, posture, and plyometrics meet zone 2 aerobic volume. Build a body that’s strong, fast, and durable.<\/i><\/p><hr><h4><b>Strength Prep<\/b><\/h4><p><b><a href=\"https://youtu.be/RUXLuZ_GLrE\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Heels-Elevated Squat<\/a><\/b><b> – Tempo 4/2/1/1<\/b><br>Use a controlled 4-second descent, 2-second pause at the bottom, 1-second rise, and 1-second pause at the top.<\/p><p><b><a href=\"https://youtu.be/pz70FwVRDJE\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Tibialis Raise<\/a><\/b><b> – 1x30<\/b><br>Slow and controlled. Focus on activation through the shins.<\/p><p><b><a href=\"https://youtu.be/CufVyiLj878\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Calf Raise<\/a><\/b><b> – 1x20–30 Each Leg<\/b><br>Pause at the top, lower with control. Train full range.<\/p><p><b><a href=\"https://youtu.be/AzbtpwYr2So\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Poliquin Step-Up<\/a><\/b><b> – 2x20<\/b><br>Heel elevated. Drive knee forward over toes. Keep balance and posture tight.<\/p><p><b><a href=\"https://youtu.be/KmfmXwvdwVU\" target=\"_blank\" rel=\"noopener\" class=\"vid\">ATG Lunges<\/a><\/b><b> – 3x10 Each Leg<\/b><br>Controlled, deep range of motion. Heel stays down, chest tall.<\/p><hr><h4><b>Super Set – 3 Rounds<\/b><\/h4><ul><li><p><b><a href=\"https://youtu.be/_t9edkC6aa0\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Calf Isometric Hold <\/a><\/b><b>– 3 sec<\/b> at top position<\/p><\/li><li><p><b><a href=\"https://youtu.be/YGlAdtSKQaU\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Jefferson Curl<\/a><\/b><b> – 3 reps<\/b> slow and smooth, full spinal articulationge)<\/p><\/li><\/ul><hr><h4><b>Power &amp; Jump Work<\/b><\/h4><p><b>Sled Push – 1x50m<\/b><br>Unbroken effort. Strong drive. Stay tall.<\/p><p><b><a href=\"https://www.youtube.com/shorts/ak8BTDZJd7M\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Single-Leg Broad Jump<\/a><\/b><b> – 3x2 Each Leg<\/b><br>Stick each landing. Focus on power and body control.<\/p><p><b><a href=\"https://youtu.be/j260zYfRz8Q\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Standing Vertical Jump<\/a><\/b><b> – 3x2<\/b><br>Reset between reps. Max height with clean form.<\/p><hr><h4><b>Main Strength Movement<\/b><\/h4><p><b>Deadlift – 3x5 @ 80–85%<\/b><br>Heavy but snappy. Speed on the bar with control.<br><i>Rest 90–120 seconds between sets.<\/i><\/p><hr><h4><b>Super Set – 3 Rounds<\/b><\/h4><ul><li><p><b>Heels Elevated Goblet Squat – x15<\/b><\/p><\/li><li><p><b>Pull-Up – x2 RIR (Reps In Reserve)<\/b><\/p><\/li><\/ul><hr><h4><b>Accessory Finisher<\/b><\/h4><ul><li><p><b>Toes to Bar – x2 RIR<\/b><\/p><\/li><li><p><b>Push-Ups – x2 RIR<\/b><br><i>Go until you’ve got 2 good reps left in the tank.<\/i><\/p><\/li><\/ul><hr><h3><b>AEROBIC OPTION<\/b><\/h3><p><i>Optional zone 2 flush to promote recovery and aerobic endurance.<\/i><\/p><p><b>3–4 Rounds:<\/b><\/p><ul><li><p>3 min Row<\/p><\/li><li><p>3 min Ski<\/p><\/li><li><p>3 min Bike or Run<br>Keep RPE around 5/10 — smooth, steady, sustainable.<\/p><\/li><\/ul>"}, {"id": 2496774, "di": 2, "day": "Wednesday", "title": "Threshold with Float", "tags": ["threshold"], "html": "<p><i>Build your capacity to hold a strong effort while staying smooth under fatigue. This is all about pacing mastery and aerobic strength.<\/i><\/p><hr><h4><b>Prep<\/b><\/h4><p><b>5 min Backwards Walking<\/b><br>Wake up your glutes, knees, and ankles.<\/p><p><b>Happy Hip Flow<\/b><br>Open the hips and prep for dynamic range of motion.<\/p><p><b>Running Drills:<\/b><\/p><ul><li><p><b>A-Skips<\/b> – Focus on rhythm and posture<\/p><\/li><li><p><b>B-Skips<\/b> – Work on knee drive and leg extension<\/p><\/li><\/ul><hr><h4><b>Warm-Up<\/b><\/h4><p><b>10–15 min Easy Aerobic Run<\/b><br>Settle into an effortless stride, build heat, and find your rhythm.<\/p><p><b>4 x 100m Strides<\/b><br>Run these at 90% of sprint effort — with perfect distance-running form.<br><i>Rest 60 seconds between each.<\/i><\/p><hr><h4><b>Main Set: Threshold with Float<\/b><\/h4><p><b>4–6 x 800m @ Threshold Pace (Zone 4 HR)<\/b><\/p><ul><li><p><b>200m Float Recovery<\/b> between each rep<br>(<i>Float = your steady Zone 2 run pace. This is not a slow jog.<\/i>)<\/p><\/li><\/ul><blockquote><p>Focus on holding consistent pacing through the float. You’re not stopping — you’re <i>managing effort.<\/i><\/p><\/blockquote><hr><h4><b>Cool-Down<\/b><\/h4><p><b>10–15 min Easy Jog<\/b><br>Gradually bring your heart rate back down and shake out any tension.<\/p><hr><h4><b>Coaching Tips<\/b><\/h4><ul><li><p>Float means <i>active recovery<\/i>, not rest.<\/p><\/li><li><p>Threshold pace should feel like an RPE of 7–8: “comfortably hard.”<\/p><\/li><li><p>Pay attention to how your form holds up during the float — that’s the real test.<\/p><\/li><li><p>This is a <i>strength workout in disguise<\/i> — you’re building aerobic durability with every rep.<\/p><\/li><\/ul>"}, {"id": 2496775, "di": 3, "day": "Thursday", "title": "Mechanical Fartlek + Mobility Flow", "tags": ["aerobic", "mobility"], "html": "<p><i>Move well, then move better. This combo builds smooth aerobic output while dialing in mobility and running mechanics.<\/i><\/p><hr><h4><b>Mobility (Kruse + Static Stretch)<\/b><\/h4><p><b>Prep + Reset your range.<\/b> Prioritize slow breathing and clean positions.<\/p><ul><li><p><b>Foot Roll<\/b><\/p><\/li><li><p><b>Ankle Roll – Out / In / Back<\/b><\/p><\/li><li><p><b>Hip Roll<\/b><\/p><\/li><li><p><b>Knee Roll<\/b><\/p><\/li><li><p><b>Front Hip Roll<\/b><\/p><\/li><\/ul><p><b>Stretch Series:<\/b><\/p><ul><li><p><b>Pec Stretch<\/b><\/p><\/li><li><p><b>Lat Stretch (Prayer Stretch)<\/b><\/p><\/li><li><p><b>Couch Stretch<\/b><\/p><\/li><li><p><b>Knight Stretch<\/b><\/p><\/li><li><p><b>Pigeon Pose<\/b><\/p><\/li><\/ul><hr><h4><b>Mechanical Fartlek<\/b><\/h4><p><b>32–40 min Continuous Run<\/b><br>Alternate between aerobic gears — stay sharp, stay smooth.<\/p><ul><li><p><b>2 min Uptempo Running<\/b><br><i>Perfect form, quick cadence, HR capped at 180 – age or 75% max HR<\/i><\/p><\/li><li><p><b>2 min Controlled Running<\/b><br><i>Same great form, 10–20 sec/mi slower<\/i><\/p><\/li><\/ul><p>Repeat this pattern throughout. No walk breaks. Stay in <b>Zone 2<\/b> the whole time.<\/p><hr><h4><b>Coaching Tips<\/b><\/h4><ul><li><p>This is not about speed — it's about <b>rhythm, posture, and control<\/b>.<\/p><\/li><li><p>If your heart rate spikes above your cap, back off until it settles.<\/p><\/li><li><p>Think of this as <i>form-focused endurance<\/i> — quality over quantity.<\/p><\/li><\/ul>"}, {"id": 2496776, "di": 4, "day": "Friday", "title": "Rest", "tags": ["rest"], "html": ""}, {"id": 2496777, "di": 5, "day": "Saturday", "title": "Hill Sprints + Aerobic Flush", "tags": ["speed", "aerobic"], "html": "<p><i>Power. Form. Grit. This session sharpens running mechanics and builds strength through hill resistance — then teaches your body to recover under load.<\/i><\/p><hr><h4><b>Prep<\/b><\/h4><p><b>5 min Backwards Walking<\/b><br>Warm up the knees and ankles — activate the posterior chain.<\/p><p><b>Happy Hip Flow<\/b><br>Get the hips loose and moving in full range.<\/p><p><b>Running Drills:<\/b><\/p><ul><li><p><b>A-Skips<\/b> – Focus on posture and rhythm<\/p><\/li><li><p><b>B-Skips<\/b> – Drive and extension coordination<\/p><\/li><\/ul><hr><h4><b>Warm-Up<\/b><\/h4><p><b>10–15 min Easy Aerobic Run<\/b><br>Jog to your hill of choice — Zone 2 effort, smooth and steady.<\/p><hr><h4><b>Main Set: Hill Sprints<\/b><\/h4><p><b>5 x 30-second Hill Sprints<\/b><\/p><ul><li><p>Full effort <i>with perfect form<\/i> — NOT a wild sprint<\/p><\/li><li><p>Walk or jog back down for full recovery between reps<\/p><\/li><\/ul><hr><h4><b>Post-Sprint Aerobic Work<\/b><\/h4><p><b>20–30 min Easy Aerobic Run<\/b><br>Zone 2 only — smooth it out, rebuild rhythm after power effort.<\/p><blockquote><p><b>Build to near-sprint pace on the hill<\/b> — but not at the cost of form. Stay tall, drive your knees, and land soft. Use the hill to <i>reinforce running mechanics under tension<\/i>.<\/p><\/blockquote><hr><h4><b>Coaching Tips<\/b><\/h4><ul><li><p>Sprinting uphill is a <b>form primer<\/b> as much as a power workout.<\/p><\/li><li><p>Stay <i>just below<\/i> max intensity — keep every stride intentional.<\/p><\/li><li><p>The second half of this workout is just as important: aerobic recovery after intensity builds resilience.<\/p><\/li><li><p>If needed, adjust the number of hill sprints to match your fitness and recovery level.<\/p><\/li><\/ul>"}, {"id": 2496778, "di": 6, "day": "Sunday", "title": "Mobility + Easy Run Efficiency Builder", "tags": ["aerobic", "mobility"], "html": "<p><i>Run well, move well, feel better. Today’s focus is quality aerobic work paired with mobility for durability and recovery.<\/i><\/p><hr><h4><b>Mobility (Kruse + Static Stretch)<\/b><\/h4><p><b>Start with movement prep and end-range work to restore joint quality.<\/b><\/p><ul><li><p><b>Foot Roll<\/b><\/p><\/li><li><p><b>Ankle Roll – Out / In / Back<\/b><\/p><\/li><li><p><b>Hip Roll<\/b><\/p><\/li><li><p><b>Knee Roll<\/b><\/p><\/li><li><p><b>Front Hip Roll<\/b><\/p><\/li><\/ul><p><b>Static Stretch Series:<\/b><\/p><ul><li><p><b>Standing Stretch<\/b><\/p><\/li><li><p><b>Laying Pec Stretch<\/b><\/p><\/li><li><p><b>Butterfly Stretch<\/b><\/p><\/li><li><p><b>90/90 Hip Stretch<\/b><\/p><\/li><li><p><b>Pigeon Pose<\/b><\/p><\/li><\/ul><blockquote><p>Take your time with these — breathe into each position. Slow = effective.<\/p><\/blockquote><hr><h4><b>Easy Run<\/b><\/h4><p><b>40–50 min @ Zone 2 / Low Zone 3 effort<\/b><br>Stay relaxed. Stay consistent. Let the engine hum.<\/p><blockquote><p><b>Intent:<\/b> Improve aerobic efficiency and reinforce good running mechanics without overreaching.<\/p><\/blockquote><hr><h4><b>Coaching Tips<\/b><\/h4><ul><li><p>\"Easy\" means <b>controlled, efficient, and smooth<\/b> — not slow and sloppy.<\/p><\/li><li><p>Faster is <i>not<\/i> better here.<\/p><\/li><li><p>Focus on posture, cadence, and stride mechanics.<\/p><\/li><li><p>This is where aerobic fitness is really built — don’t overlook it.<\/p><\/li><\/ul>"}, {"id": 3409816, "di": 6, "day": "Sunday", "title": "Sunday Recap – Week 4: Reflections", "tags": ["recap"], "recap": {"prompt": "What early signal are you noticing in your running right now, especially around efficiency?", "sub": "", "example": "I’m noticing that my running feels more efficient even when the pace hasn’t changed. I’m settling in faster, breathing feels steadier, and I’m using less effort to hold the same rhythm."}}]}, {"n": 5, "label": "W5", "name": "Week 5", "sessions": [{"id": 2496832, "di": 0, "day": "Monday", "title": "Running Strength Day – Power + Durability Focus", "tags": ["strength"], "html": "<p><i>Speed is built from the ground up — today we hit strength, explosiveness, and controlled aerobic work to boost your running economy.<\/i><\/p><hr><h4><b>Warm-Up / Prep<\/b><\/h4><p><b><a href=\"https://youtu.be/RUXLuZ_GLrE\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Heels-Elevated Squat<\/a><\/b><b> – Tempo 4/2/1/1<\/b><br>Use a controlled 4-second descent, 2-second pause at the bottom, 1-second rise, and 1-second pause at the top..<\/p><hr><h4><b>Activation &amp; Strength Block<\/b><\/h4><p><b>Tibialis Raise<\/b> – 1x30 reps<br><b>Calf Raise<\/b> – 1x20–30 each leg<br><b>Paloquin Step-Up<\/b> – 2x20<br><b>ATG Lunges<\/b> – 3x10 (full depth, knee over toe)<\/p><hr><h4><b>Super Set #1<\/b><\/h4><p><b>3 Rounds<\/b><\/p><ul><li><p><b>Calf Isometric Hol
