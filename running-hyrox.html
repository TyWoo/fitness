d<\/b> – 3 x 3 seconds<\/p><\/li><li><p><b>Jefferson Curls<\/b> – 3 x 3 reps (light and controlled)<\/p><\/li><\/ul><hr><h4><b>Explosive Power Block<\/b><\/h4><ul><li><p><b>Med Ball Slam<\/b> – 3x5 (light weight, max intent)<\/p><\/li><li><p><b>Standing Vertical Jump or Drop Jump<\/b> – 3x2 (focus on reactivity)<\/p><\/li><li><p><b>Sled Push<\/b> – 3x25m @ heavy<br><i>Pick a weight you can move for one length, but not two. Rest 2 mins between pushes.<\/i><\/p><\/li><\/ul><hr><h4><b>Strength Focus<\/b><\/h4><p><b>Hip Thrust<\/b> – 3x8 @ moderate weight<br><i>Use a bench or box for support. Sub with Straight-Leg Deadlifts if needed.<\/i><br>Rest 90–120 sec<\/p><hr><h4><b>Super Set #2 – Power &amp; Stability<\/b><\/h4><p><b>3 Rounds<\/b><\/p><ul><li><p><b>KB Swings<\/b> – 10 reps (heavy)<\/p><\/li><li><p><b>Push-Ups<\/b> – To 2 RIR<br>Rest 1 min between rounds<\/p><\/li><\/ul><hr><h4><b>Accessory Finisher<\/b><\/h4><p><b><a href=\"https://youtu.be/VmB1G1K7v94\" target=\"_blank\" rel=\"noopener\" class=\"vid\">DB Bench Press<\/a><\/b> – 3x8<br><b><a href=\"https://youtu.be/-t7fuZ0KhDA\" target=\"_blank\" rel=\"noopener\" class=\"vid\">DB Front Raise<\/a><\/b> – 3x8<br><i>Controlled, clean form. No swinging.<\/i><\/p><hr><h3><b>AEROBIC OPTION (if subbing or adding)<\/b><\/h3><p><b>5 Rounds:<\/b><\/p><ul><li><p>3 min Row<\/p><\/li><li><p>3 min Ski<\/p><\/li><li><p>3 min Bike or Run<br><i>Stay in Z2/Low Z3 — steady and smooth.<\/i><\/p><\/li><\/ul><hr><h4><b>Coaching Notes<\/b><\/h4><ul><li><p>This is a <b>total power + strength<\/b> day with crossover benefits to your running posture, explosiveness, and durability.<\/p><\/li><li><p>Focus on <b>perfect form under fatigue<\/b> and move with intent.<\/p><\/li><li><p>Don’t underestimate the sled and hip thrust combo — this is where the gains live.<\/p><\/li><\/ul>"}, {"id": 2496833, "di": 1, "day": "Tuesday", "title": "Threshold with Float", "tags": ["threshold"], "html": "<p><i>Dial in pacing. Train right at the edge of your aerobic ceiling. Stay sharp, stay smooth.<\/i><\/p><hr><h4><b>Prep + Dynamic Warm-Up<\/b><\/h4><ul><li><p><b>5 min Backwards Walking<\/b><\/p><\/li><li><p><b>Happy Hip Mobility Flow<\/b><\/p><\/li><\/ul><p><b>Marching + Running Drills:<\/b><\/p><ul><li><p><b>A-Skips<\/b><\/p><\/li><li><p><b>B-Skips<\/b><\/p><\/li><\/ul><hr><h4><b>Warm-Up Run<\/b><\/h4><p><b>10–15 min easy aerobic run<\/b><br>Stay relaxed. Let your heart rate gradually rise into Zone 2.<\/p><hr><h4><b>Strides (Speed Prep)<\/b><\/h4><p><b>5 x 100m Strides<\/b> @ 90% sprint with perfect distance form<\/p><ul><li><p><b>60 seconds rest<\/b> between each<br>These prep your nervous system and reinforce smooth, fast mechanics.<\/p><\/li><\/ul><hr><h4><b>Main Set – Threshold Intervals<\/b><\/h4><p><b>5–7 x 1000m @ Threshold Pace (Z4 HR)<\/b><\/p><ul><li><p><b>200m “Float” Recovery<\/b> between each rep<br><i>Float = controlled run at Zone 2 — not a slow jog. Stay moving, stay smooth.<\/i><\/p><\/li><\/ul><blockquote><p>Find your rhythm. These reps should feel \"comfortably hard\" — just below breathless.<\/p><\/blockquote><hr><h4><b>Cool Down<\/b><\/h4><p><b>10–15 min easy aerobic run<\/b><br>Bring your heart rate down gradually and lock in the gains.<\/p><hr><h4><b>Coaching Tips<\/b><\/h4><ul><li><p>Don’t go out hot. Use the first few reps to dial in your pace.<\/p><\/li><li><p>The “float” matters — practice staying composed and steady under fatigue.<\/p><\/li><li><p>This workout sharpens your <b>pacing discipline<\/b> and <b>aerobic power.<\/b><\/p><\/li><\/ul>"}, {"id": 2496834, "di": 2, "day": "Wednesday", "title": "Mechanical Fartlek + Mobility Reset", "tags": ["aerobic", "mobility"], "html": "<p><i>Efficient form, steady rhythm, and focused recovery — build the engine and keep it mobile.<\/i><\/p><hr><h4><b>Mobility (Kruse + Static Stretch)<\/b><\/h4><p><b>Start here to open things up and prep for quality movement.<\/b><\/p><ul><li><p><b>Foot Roll<\/b><\/p><\/li><li><p><b>Ankle Roll (Out/In/Back)<\/b><\/p><\/li><li><p><b>Hip Roll<\/b><\/p><\/li><li><p><b>Knee Roll<\/b><\/p><\/li><li><p><b>Front Hip Roll<\/b><\/p><\/li><\/ul><p><b>Static Stretches:<\/b><\/p><ul><li><p><b>Pec Stretch<\/b><\/p><\/li><li><p><b>Lat Stretch (Prayer Pose)<\/b><\/p><\/li><li><p><b>Couch Stretch<\/b><\/p><\/li><li><p><b>Knight Stretch<\/b><\/p><\/li><li><p><b>Pigeon Pose<\/b><\/p><\/li><\/ul><hr><h4><b>Run: Mechanical Fartlek (35–40 min)<\/b><\/h4><p><b>Structured Z2 work with form-focused effort shifts<\/b><\/p><p>Alternate:<\/p><ul><li><p><b>3 min uptempo<\/b> with perfect form (HR cap = 180-age or 75% max HR)<\/p><\/li><li><p><b>2 min steady<\/b> with equally clean form, but pace is 10–20 sec/mile slower<\/p><\/li><\/ul><blockquote><p>The goal: all work in Zone 2. Don't let heart rate spike. This is about control, mechanics, and aerobic durability.<\/p><\/blockquote><hr><h4><b>Aerobic Option (if subbing the run)<\/b><\/h4><p><b>30 min Easy Cycling<\/b><\/p><ul><li><p>Maintain consistent cadence<\/p><\/li><li><p>RPE 5–6<\/p><\/li><li><p>Stay smooth and aerobic<\/p><\/li><\/ul><hr><h4><b>Coaching Notes<\/b><\/h4><ul><li><p>Fartlek = “speed play,” but this one is all about discipline.<\/p><\/li><li><p>Stay light on your feet and mentally dialed in.<\/p><\/li><li><p>Great session to reset form and reinforce proper posture over time.<\/p><\/li><\/ul>"}, {"id": 2496835, "di": 3, "day": "Thursday", "title": "Flat Speed + Running Strength Day", "tags": ["speed", "strength"], "html": "<p><i>Power, turnover, form — today’s about top-end mechanics and strength to back it up.<\/i><\/p><hr><h4><b>PREP + DYNAMIC WARM-UP<\/b><\/h4><ul><li><p><b>5 min Backwards Walking<\/b><\/p><\/li><li><p><b>Happy Hip Mobility Flow<\/b><\/p><\/li><\/ul><p><b>Marching + Running Drills:<\/b><\/p><ul><li><p><b>A-Skips<\/b><\/p><\/li><li><p><b>B-Skips<\/b><\/p><\/li><\/ul><hr><h3><b>PART 1: Flat Speed Session<\/b><\/h3><h4><b>Warm-Up Run<\/b><\/h4><ul><li><p><b>10–15 min easy aerobic run<\/b><\/p><\/li><\/ul><h4><b>Strides (Speed Prep)<\/b><\/h4><ul><li><p><b>4 x 100m Strides<\/b> @ 90% sprint<\/p><ul><li><p>Rest 60 sec between<\/p><\/li><\/ul><\/li><\/ul><h4><b>Main Set – Speed Development<\/b><\/h4><ul><li><p><b>2 x 300m<\/b> @ as fast as possible in <i>distance<\/i> running form<\/p><ul><li><p>Rest 2 min<\/p><\/li><\/ul><\/li><li><p><b>3 x 150m<\/b> @ as fast as possible in <i>distance<\/i> running form<\/p><ul><li><p>Rest 2 min<\/p><\/li><\/ul><\/li><\/ul><h4><b>Cool-Down Run<\/b><\/h4><ul><li><p><b>10–15 min easy aerobic run<\/b><\/p><\/li><\/ul><p><b>Coaching Tips:<\/b><\/p><p>Focus on <i>fast, relaxed, and smooth<\/i>.<br>You should be moving quickly — but not sprinting. Sprint form = different mechanics. Stay in your lane.<\/p><hr><h3><b>PART 2: Running Strength Day<\/b><\/h3><h4><b>Eccentric + Stability Block<\/b><\/h4><ul><li><p><b>Heels Elevated Eccentric Squat (4/2/1/1 tempo)<\/b><\/p><\/li><li><p><b>Tibialis Raise – 1 x 30 reps<\/b><\/p><\/li><li><p><b>Calf Raise – 1 x 20–30 each leg<\/b><\/p><\/li><li><p><b>Paloquin Step-Up – 2 x 20 reps<\/b><\/p><\/li><li><p><b>ATG Lunges – 3 x 10 each leg<\/b><\/p><\/li><\/ul><h4><b>Super Set – Posterior Chain Activation<\/b><\/h4><ul><li><p><b>Calf Isometric – 3 x 3 sec holds<\/b><\/p><\/li><li><p><b>Jefferson Curls – 3 x 3 reps<\/b><\/p><\/li><\/ul><hr><h4><b>Plyometrics &amp; Power<\/b><\/h4><ul><li><p><b>Single Leg Box Jump – 3 x 2<\/b> (Use stacked plates or a very low box)<\/p><\/li><li><p><b>Standing Broad Jump – 3 x 2<\/b><\/p><\/li><\/ul><hr><h4><b>Main Strength Movement<\/b><\/h4><ul><li><p><b>Barbell Reverse Lunge – 4 x 5<\/b><\/p><ul><li><p>Rest 90–120 sec<\/p><\/li><li><p>Controlled and strong through full range<\/p><\/li><\/ul><\/li><\/ul><hr><h4><b>Sled Work – Power &amp; Speed<\/b><\/h4><ul><li><p><b>Sled Pull – 3 x 25m @ Hyrox weight<\/b><\/p><ul><li><p><i>All-out effort<\/i><\/p><\/li><li><p>Rest 2 min between efforts<\/p><\/li><\/ul><\/li><\/ul><hr><h4><b>OPTIONAL: METCON Finisher (16-min EMOM)<\/b><\/h4><p><b>EMOM 16 min (Every Minute on the Minute):<\/b><\/p><ul><li><p>Min 0–1: 12/15 Cal Ski<\/p><\/li><li><p>Min 1–2: 12/15 Cal Row<\/p><\/li><li><p>Min 2–3: 12/15 Cal Echo Bike<\/p><\/li><li><p>Min 3–4: Max Wall Balls<\/p><\/li><\/ul><blockquote><p>Adjust cals as needed to give yourself at least 15 sec transition/rest time. The goal is quality effort with fast recovery.<\/p><\/blockquote>"}, {"id": 2496836, "di": 4, "day": "Friday", "title": "Rest", "tags": ["rest"], "html": ""}, {"id": 2496837, "di": 5, "day": "Saturday", "title": "Threshold + Machine Intervals", "tags": ["threshold", "hyrox"], "html": "<p><i>Build aerobic durability, manage fatigue, and sharpen your engine with threshold pacing across modalities.<\/i><\/p><hr><h4><b>PREP + DYNAMIC WARM-UP<\/b><\/h4><ul><li><p><b>5 min Backwards Walking<\/b><\/p><\/li><li><p><b>Happy Hip Flow<\/b><\/p><\/li><\/ul><p><b>Marching + Running Drills:<\/b><\/p><ul><li><p><b>A-Skips<\/b><\/p><\/li><li><p><b>B-Skips<\/b><\/p><\/li><\/ul><hr><h4><b>STRIDE PREP<\/b><\/h4><ul><li><p><b>4 x 100m Strides<\/b><br>@ ~90% sprint effort with perfect distance running form<\/p><ul><li><p>Rest 60 sec between<\/p><\/li><\/ul><\/li><\/ul><hr><h3><b>MAIN WORKOUT<\/b><\/h3><h4><b>Machine Prep Work<\/b><\/h4><p>@ Threshold Effort (Z4 HR or RPE 7–8)<\/p><ul><li><p><b>3 x 500m Ski Erg<\/b><\/p><ul><li><p>40 sec rest<\/p><\/li><\/ul><\/li><li><p><b>3 x 500m Row<\/b><\/p><ul><li><p>40 sec rest<\/p><\/li><\/ul><\/li><\/ul><hr><h4><b>Threshold Running Intervals<\/b><\/h4><ul><li><p><b>4 x 1600m @ Threshold pace<\/b><\/p><ul><li><p>Rest 60 sec between reps<\/p><\/li><li><p>Run with consistent pacing — this is about holding a strong, steady aerobic push<\/p><\/li><\/ul><\/li><\/ul><hr><h4><b>Machine Finisher – Directly Into:<\/b><\/h4><ul><li><p><b>3 x 500m Ski Erg<\/b><\/p><ul><li><p>40 sec rest<\/p><\/li><\/ul><\/li><li><p><b>3 x 500m Row<\/b><\/p><ul><li><p>40 sec rest<\/p><\/li><\/ul><\/li><\/ul><hr><h4><b>COOL DOWN<\/b><\/h4><ul><li><p><b>10–15 min easy aerobic run<\/b><\/p><\/li><\/ul><hr><h4><b>COACHING TIPS<\/b><\/h4><p>This is a big session. Manage your effort from the start — aim for smooth and repeatable intervals.<br>Run this on a <b>treadmill<\/b> or near machines for easy transitions.<br>Threshold = sustainable discomfort. If you're gasping early, you're going too hard.<\/p>"}, {"id": 2496838, "di": 6, "day": "Sunday", "title": "Aerobic Efficiency + Mobility Reset", "tags": ["aerobic", "mobility"], "html": "<p><i>Smooth form, steady effort, and recovery-focused movement to build your aerobic base and stay durable.<\/i><\/p><hr><h4><b>MOBILITY (Kruse + Static Stretch)<\/b><\/h4><ul><li><p><b>Foot Roll<\/b><\/p><\/li><li><p><b>Ankle Roll<\/b> (Out / In / Back)<\/p><\/li><li><p><b>Hip Roll<\/b><\/p><\/li><li><p><b>Knee Roll<\/b><\/p><\/li><li><p><b>Front Hip Roll<\/b><\/p><\/li><\/ul><p><b>Static Stretch Sequence:<\/b><\/p><ul><li><p><b>Standing Stretch<\/b><\/p><\/li><li><p><b>Laying Pec Stretch<\/b><\/p><\/li><li><p><b>Butterfly<\/b><\/p><\/li><li><p><b>90/90<\/b><\/p><\/li><li><p><b>Pigeon Pose<\/b><\/p><\/li><\/ul><hr><h4><b>EASY RUN<\/b><\/h4><ul><li><p><b>50–55 min<\/b> @ <b>Zone 2 / Low Zone 3<\/b><\/p><ul><li><p>Focus on perfect form and relaxed breathing<\/p><\/li><li><p>Remember: <b>Faster is not better<\/b><\/p><\/li><\/ul><\/li><\/ul><hr><h4><b>CYCLING FINISHER<\/b><\/h4><ul><li><p><b>30 min Easy Spin<\/b><\/p><ul><li><p>Stay relaxed and aerobic<\/p><\/li><li><p>Great time to focus on cadence and leg rhythm<\/p><\/li><\/ul><\/li><\/ul><hr><p><b>Coaching Notes:<\/b><br>This session is about efficiency, not intensity. Run tall, stay smooth, and don’t chase speed. These are the sessions that quietly build your fitness over time.<\/p>"}, {"id": 3409947, "di": 6, "day": "Sunday", "title": "Sunday Recap – Week 5: Reflections", "tags": ["recap"], "recap": {"prompt": "What are you noticing about your running mechanics when fatigue sets in?", "sub": "", "example": "Late in runs, I tend to shorten my stride and tense up. Just noticing that has helped me stay more relaxed."}}]}, {"n": 6, "label": "W6", "name": "Week 6", "sessions": [{"id": 2496864, "di": 0, "day": "Monday", "title": "Running Strength Day – Speed, Power & Core Stability", "tags": ["speed", "strength"], "html": "<p><i>Explosive strength meets smart durability. Build elastic power without the grind.<\/i><\/p><hr><h4><b>PREP WORK<\/b><\/h4><p><i>Heels Elevated Eccentric Calf Raise (Tempo: 4/2/1/1)<\/i><\/p><ul><li><p><b>Tibialis Raise<\/b> – 1x30<\/p><\/li><li><p><b>Calf Raise<\/b> – 1x20-30 each leg<\/p><\/li><li><p><b>Paloquin Step-Up<\/b> – 2x20<\/p><\/li><li><p><b>ATG Lunges<\/b> – 3x10<\/p><\/li><\/ul><p><b>Super Set<\/b><\/p><ul><li><p><b>Calf Isometric<\/b> – 3x3 sec<\/p><\/li><li><p><b>Jefferson Curl<\/b> – 3x3 reps<\/p><\/li><\/ul><hr><h4><b>POWER &amp; PLYOMETRICS<\/b><\/h4><ul><li><p><b><a href=\"https://youtu.be/QxYhFwMd1Ks\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Med Ball Slams<\/a><\/b> – 3x5 (light weight, max intent)<\/p><\/li><li><p><b><a href=\"https://youtu.be/LrZuW-sJPBo\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Vertical or Drop Jumps<\/a><\/b> – 4x2<\/p><\/li><li><p><b>Sled Push<\/b> – 4x25m @ <b>light &amp; fast<\/b> (2 min rest)<\/p><\/li><\/ul><hr><h4><b>STRENGTH BLOCK<\/b><\/h4><ul><li><p><b><a href=\"https://youtu.be/Zp26q4BY5HE\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Hip Thrust<\/a><\/b> – 3x10 @ moderate weight<br><i>Rest 90–120 sec. Sub w/ Straight Leg Deadlift if needed.<\/i><\/p><\/li><\/ul><p><b>Super Set (3 Rounds)<\/b><\/p><ul><li><p><a href=\"https://youtu.be/1WFO6YBfOLo\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Barbell Reverse Curl<\/a> – 8 reps<\/p><\/li><li><p><a href=\"https://youtu.be/tftmWIKx8yE\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Weighted V-Ups<\/a> – 15 reps<\/p><\/li><li><p>Max Dead Hang<br><i>Rest 1 min between rounds<\/i><\/p><\/li><\/ul><hr><h4><b>ACCESSORY STRENGTH<\/b><\/h4><ul><li><p><b><a href=\"https://youtu.be/VmB1G1K7v94\" target=\"_blank\" rel=\"noopener\" class=\"vid\">DB Bench Press<\/a><\/b> – 3x10<\/p><\/li><li><p><b><a href=\"https://youtu.be/-t7fuZ0KhDA\" target=\"_blank\" rel=\"noopener\" class=\"vid\">DB Front Raise<\/a><\/b> – 3x10<\/p><\/li><\/ul><hr><h4><b>AEROBIC OPTION<\/b><\/h4><p><b>Pick your poison:<\/b><\/p><ul><li><p><b>5 Rounds:<\/b><\/p><ul><li><p>3 min Row<\/p><\/li><li><p>3 min Ski<\/p><\/li><li><p>3 min Bike or Run<\/p><\/li><\/ul><\/li><\/ul><p><b>OR<\/b><\/p><ul><li><p><b>45 min Easy Run<\/b> @ Zone 2<\/p><\/li><\/ul><hr><p><b>Coaching Notes:<\/b><br>Explosive, sharp, and controlled. Every movement today should feel like you're <i>recruiting<\/i> muscles with intent, not just going through the motions. Keep tempo honest, and own your form. Don't sleep on the aerobic work — it’s what carries you in long races and brutal workouts.<\/p>"}, {"id": 2496865, "di": 1, "day": "Tuesday", "title": "Threshold with Float – Control Under Pressure", "tags": ["threshold"], "html": "<p><i>Dial in your pace, control your effort, and master your form under fatigue.<\/i><\/p><hr><h4><b>PREP<\/b><\/h4><ul><li><p><b>5 min Backwards Walking<\/b><\/p><\/li><li><p><b>Happy Hip Mobility Flow<\/b><\/p><\/li><li><p><b>Marching Drills<\/b><\/p><\/li><li><p>A-Skips<\/p><\/li><li><p>B-Skips<\/p><\/li><\/ul><hr><h4><b>WARM-UP<\/b><\/h4><ul><li><p><b>10–15 min Easy Aerobic Run<\/b><\/p><\/li><li><p><b>5 x 100m Strides<\/b> @ 90% sprint effort in perfect distance form<\/p><ul><li><p>Rest 60 seconds between strides<\/p><\/li><\/ul><\/li><\/ul><hr><h4><b>MAIN SET<\/b><\/h4><p><b>4 Total Rounds<\/b><br>Each round includes:<\/p><p><b>3 Sets of:<\/b><\/p><ul><li><p>200m Fast (distance running form)<\/p><\/li><li><p>200m Threshold pace<\/p><\/li><li><p><i>(No rest between sets)<\/i><\/p><\/li><\/ul><p><b>Then:<\/b><\/p><ul><li><p>400m Jog before starting the next round<\/p><\/li><\/ul><p>➡️ Each round totals 1600m<br>➡️ Entire block = 4 miles of quality + 1 mile of recovery jogs<\/p><hr><h4><b>TEMPO FINISHER<\/b><\/h4><ul><li><p><b>10 min @ Tempo Pace (Z4 HR)<\/b><br><i>Hold strong form. Stay sharp under fatigue.<\/i><\/p><\/li><\/ul><p><b>Rest 2 min<\/b><\/p><hr><h4><b>COOL-DOWN<\/b><\/h4><ul><li><p><b>10–15 min Easy Aerobic Run<\/b><\/p><\/li><\/ul><hr><p><b>Coaching Notes:<\/b><br>This is all about rhythm and recovery. You’ll bounce between fast, threshold, and float while keeping mechanics locked in. The 10-minute tempo after all the volume is where the real work happens. Stay focused. Keep your posture and turnover consistent, especially when tired.<\/p>"}, {"id": 2496866, "di": 2, "day": "Wednesday", "title": "Mechanical Fartlek + Mobility Reset", "tags": ["aerobic", "mobility"], "html": "<p><i>Perfect form, smooth pacing, and a movement-focused cool down.<\/i><\/p><hr><h4><b>Part 1: Mobility (Kruse + Static Stretch)<\/b><\/h4><p>Start here to open up joints and prep the body.<\/p><p><b>Mobility Flow:<\/b><\/p><ul><li><p>Foot Roll<\/p><\/li><li><p>Ankle Roll (Out / In / Back)<\/p><\/li><li><p>Hip Roll<\/p><\/li><li><p>Knee Roll<\/p><\/li><li><p>Front Hip Roll<\/p><\/li><\/ul><p><b>Then move into static stretches:<\/b><\/p><ul><li><p>Lying Pec Stretch<\/p><\/li><li><p>Prayer Lat Stretch<\/p><\/li><li><p>Couch Stretch<\/p><\/li><li><p>Knight Stretch<\/p><\/li><li><p>Pigeon Pose<\/p><\/li><\/ul><p><b>Quote of the Day:<\/b><\/p><blockquote><p>“Flexibility makes you strong. Stillness makes you fast.”<\/p><\/blockquote><hr><h4><b>Part 2: Mechanical Fartlek<\/b><\/h4><p><b>Duration:<\/b> 35–40 minutes<\/p><p><b>Structure:<\/b><\/p><ul><li><p>3 minutes at uptempo pace with perfect form<\/p><ul><li><p>Heart rate cap: 180 minus your age, or around 75% of your max<\/p><\/li><\/ul><\/li><li><p>2 minutes with perfect form, but about 10–20 seconds per mile slower<\/p><\/li><\/ul><p>Repeat this pattern continuously.<br>Focus on posture, cadence, and breath.<br>Stay entirely in Zone 2.<\/p><p><b>Coaching Tip:<\/b><br>This isn’t about speed—it’s about skill. Run with rhythm and control. You’re teaching your body how to move well for a long time. That’s endurance.<\/p><hr><h4><b>Optional Aerobic Alternative<\/b><\/h4><p>30 minutes of Zone 2 cycling<\/p><ul><li><p>Easy cadence<\/p><\/li><li><p>Upright posture<\/p><\/li><li><p>Smooth pedal strokes<\/p><\/li><\/ul>"}, {"id": 2496867, "di": 3, "day": "Thursday", "title": "Power & Speed Day — Strength Meets Hills", "tags": ["speed", "strength"], "html": "<p><i>Build explosiveness, sharpen mechanics, and finish fast.<\/i><\/p><hr><h4><b>PREP<\/b><\/h4><p>Start with 5 minutes of backwards walking to open up ankles and knees.<br>Then move into:<\/p><ul><li><p><b>Happy Hip<\/b><\/p><\/li><li><p><b>Marching + Running Drills<\/b><\/p><ul><li><p>A-Skips<\/p><\/li><li><p>B-Skips<\/p><\/li><\/ul><\/li><\/ul><p>Focus on posture, rhythm, and range of motion.<\/p><hr><h4><b>PART 1: Running Strength Day<\/b><\/h4><p><i>Target: Control, power, and single-leg stability.<\/i><\/p><p><b>Isolated Strength + Prep<\/b><\/p><ul><li><p>Heels Elevated Eccentric Squat: 4/2/1/1 tempo<\/p><\/li><li><p>Tibialis Raise: 1x30<\/p><\/li><li><p>Calf Raise: 1x20-30 each leg<\/p><\/li><li><p>Paloquin Step Up: 2x20<\/p><\/li><li><p>ATG Lunges: 3x10<\/p><\/li><\/ul><p><b>Super Set (x3)<\/b><\/p><ul><li><p>Calf Isometric Hold: 3 sec<\/p><\/li><li><p>Jefferson Curl: 3 reps<\/p><\/li><\/ul><p><b>Explosive Power<\/b><\/p><ul><li><p>Single Leg Box Jump: 3x2<\/p><\/li><li><p>Standing Broad Jump: 3x2<\/p><\/li><\/ul><p><b>Heavy Strength Move<\/b><\/p><ul><li><p>Barbell Reverse Lunge: 5x5<\/p><ul><li><p>Rest 90–120 sec between sets<\/p><\/li><\/ul><\/li><\/ul><p><b>Finish Strong<\/b><\/p><ul><li><p>Sled Pull: 1 x 75m @ Hyrox weight, as fast as possible<\/p><\/li><\/ul><p><b>Coaching Tip:<\/b><br>This session is all about <i>clean movement under tension.<\/i> Go lighter if form is slipping. Save max effort for the sled pull.<\/p><hr><h4><b>PART 2: Hill Sprints<\/b><\/h4><p><i>Sharp speed work on tired legs = athletic gold.<\/i><\/p><p><b>Build In:<\/b><\/p><ul><li><p>10–15 min aerobic run to your hill<\/p><\/li><\/ul><p><b>Main Set:<\/b><\/p><ul><li><p>6 x 30s uphill sprints<\/p><ul><li><p>Walk/jog back to recover<\/p><\/li><\/ul><\/li><\/ul><p><b>Cool Down:<\/b><\/p><ul><li><p>20–30 min easy aerobic running after your last rep<\/p><\/li><\/ul><p><b>Coaching Tip:<\/b><br>Run fast, but don’t sprint sloppy. Power from the hips, stay tall, and focus on smooth, explosive strides. This is your chance to teach your body what <i>fast with control<\/i> feels like.<\/p><hr><p><b>Quote of the Day:<\/b><\/p><blockquote><p>“Power is nothing without control.”<\/p><\/blockquote>"}, {"id": 2496868, "di": 4, "day": "Friday", "title": "Rest", "tags": ["rest"], "html": ""}, {"id": 2496869, "di": 5, "day": "Saturday", "title": "Threshold Effort + Machine Grind", "tags": ["threshold", "hyrox"], "html": "<p><i>Sharpen your engine, hold your form under fatigue, and build race-day readiness.<\/i><\/p><hr><h4><b>PREP<\/b><\/h4><p>Start with 5 minutes of <b>Backwards Walking<\/b> — activate glutes, open up ankles, and set posture.<br>Then flow into:<\/p><ul><li><p><b>Happy Hip Mobility<\/b><\/p><\/li><li><p><b>Marching + Running Drills:<\/b><\/p><ul><li><p>A-Skips<\/p><\/li><li><p>B-Skips<\/p><\/li><\/ul><\/li><\/ul><p>Use this time to lock in mechanics before the real work begins.<\/p><hr><h4><b>PART 1: Running Threshold Block<\/b><\/h4><p><i>Dial in control at high effort.<\/i><\/p><ul><li><p>10–15 min easy aerobic run<\/p><\/li><li><p>5 x 100m Stride @ 90% effort, with perfect distance form<\/p><ul><li><p>Rest 60 seconds between each<\/p><\/li><\/ul><\/li><\/ul><p>Then:<\/p><ul><li><p><b>2400m @ Threshold (Z4)<\/b><\/p><ul><li><p>Rest 2:00<\/p><\/li><\/ul><\/li><li><p><b>2000m @ Threshold<\/b><\/p><ul><li><p>Rest 1:30<\/p><\/li><\/ul><\/li><li><p><b>1600m @ Threshold<\/b><\/p><ul><li><p>Rest 1:00<\/p><\/li><\/ul><\/li><\/ul><hr><h4><b>PART 2: Machine Threshold Work<\/b><\/h4><p><i>Simulate fatigue and carry your form through it.<\/i><\/p><ul><li><p>2 x 750m Ski @ Threshold<\/p><ul><li><p>Rest 60 sec<\/p><\/li><\/ul><\/li><li><p>2 x 750m Row @ Threshold<\/p><ul><li><p>Rest 40 sec<\/p><\/li><\/ul><\/li><\/ul><hr><h4><b>Cool Down + Reset<\/b><\/h4><ul><li><p>Rest 2 minutes<\/p><\/li><li><p>10–15 min easy aerobic run (or walk if needed)<\/p><\/li><\/ul><hr><h4><b>Coaching Tips<\/b><\/h4><p>This workout is best done on a treadmill or in a facility where your machines are close by. The goal here isn’t speed for speed’s sake — it’s about <b>sustained effort while maintaining clean form<\/b>. Let your posture lead, keep your cadence smooth, and push into discomfort without breaking down.<\/p><hr><h4><b>Quote of the Day<\/b><\/h4><blockquote><p>“Discomfort is a signal. Keep your form anyway.”<\/p><\/blockquote>"}, {"id": 2496870, "di": 6, "day": "Sunday", "title": "Long Easy Effort + Mobility Reset", "tags": ["aerobic", "mobility"], "html": "<p><i>Today’s about smooth miles, smooth movement, and laying the foundation for performance.<\/i><\/p><hr><h4><b>Mobility (Kruse + Static Stretch Flow)<\/b><\/h4><p>Loosen up and build range in the spots that take the most load. Roll first, then flow.<\/p><ul><li><p><b>Foot Roll<\/b><\/p><\/li><li><p><b>Ankle Roll (Out/In/Back)<\/b><\/p><\/li><li><p><b>Hip Roll<\/b><\/p><\/li><li><p><b>Knee Roll<\/b><\/p><\/li><li><p><b>Front Hip Roll<\/b><\/p><\/li><\/ul><p>Then into static work:<\/p><ul><li><p><b>Standing Stretch<\/b><\/p><\/li><li><p><b>Laying Pec Stretch<\/b><\/p><\/li><li><p><b>Butterfly Stretch<\/b><\/p><\/li><li><p><b>90/90 Hip Stretch<\/b><\/p><\/li><li><p><b>Pigeon Pose<\/b><\/p><\/li><\/ul><hr><h4><b>Aerobic Training Block<\/b><\/h4><p><b>Easy Run<\/b><\/p><ul><li><p>55–60 min @ Z2/Low Z3<\/p><\/li><li><p>Use this run to dial in efficiency, form, and flow.<\/p><\/li><li><p>RPE should stay around 5–6. This is aerobic, not a race.<\/p><\/li><\/ul><p><b>Then:<\/b><br><b>Easy Bike<\/b><\/p><ul><li><p>30–35 min steady ride<\/p><\/li><li><p>Keep heart rate consistent with your run zone — just a new modality, same purpose.<\/p><\/li><\/ul><hr><h4><b>Coaching Tips<\/b><\/h4><p>Faster is not better.<br>Better is better.<br>Run like someone is watching your form the entire time — because your body is. The goal today is efficiency: how relaxed, smooth, and rhythmic can you be for a long stretch of time?<\/p><hr><h4><b>Quote of the Day<\/b><\/h4><blockquote><p>“You don’t need to prove anything on your easy days. Just show up and stay smooth.”<\/p><\/blockquote>"}, {"id": 3409980, "di": 6, "day": "Sunday", "title": "Sunday Recap – Week 6: Habits", "tags": ["recap"], "recap": {"prompt": "When did your running feel most rhythmic or natural this week?", "sub": "", "example": "My easy run mid-week felt effortless once I stopped checking pace and focused on breathing and cadence."}}]}, {"n": 7, "label": "W7", "name": "Week 7", "sessions": [{"id": 2496874, "di": 0, "day": "Monday", "title": "Running Strength Day – Power + Core Combo", "tags": ["strength"], "html": "<p>This one’s about building strength where it matters most — from the ground up, through the hips, and into your engine. Power, posture, and coordination.<\/p><hr><h4><b>Warm-Up Prep<\/b><\/h4><ul><li><p>5 minutes <b>Backwards Walking<\/b><\/p><\/li><\/ul><ul><li><p><b>A-Skips + B-Skips<\/b> (get those running mechanics sharp)<\/p><\/li><\/ul><hr><h4><b>Primary Strength Block<\/b><\/h4><p><b>Heels Elevated Eccentric Squat<\/b> – 4/2/1/1 tempo<br><b>Tibialis Raise<\/b> – 1x30 reps<br><b>Calf Raise<\/b> – 1x 20-30 each leg<br><b>Paloquin Step Up<\/b> – 2x20<br><b>ATG Lunges<\/b> – 3x10 each side<\/p><hr><h4><b>Super Set 1<\/b><\/h4><p>3 Rounds:<\/p><ul><li><p><b>Calf Isometric Hold<\/b> – 3x3 seconds<\/p><\/li><li><p><b>Jefferson Curls<\/b> – 3x3 reps<\/p><\/li><\/ul><hr><h4><b>Power &amp; Speed Block<\/b><\/h4><ul><li><p><b>Med Ball Slam<\/b> – 3x7 (light + fast)<\/p><\/li><li><p><b>Standing Vertical Jump<\/b> or <b>Drop Jump<\/b> – 3x3<\/p><\/li><li><p><b>Sled Push<\/b> – 5x12m @ <b>VERY HEAVY<\/b><br>→ Full rest (2 mins) between sets — push like your life depends on it.<\/p><\/li><\/ul><hr><h4><b>Strength Movement<\/b><\/h4><ul><li><p><b><a href=\"https://youtu.be/Zp26q4BY5HE\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Hip Thrusts<\/a><\/b> – 3x10 @ moderate weight<br>→ Add weight from last week<br><i>(Sub: Straight leg deadlifts if needed)<\/i><\/p><\/li><\/ul><hr><h4><b>Super Set 2<\/b><\/h4><p>3 Rounds:<\/p><ul><li><p>8x <b>Barbell Reverse Curl<\/b><\/p><\/li><li><p>15x <b>Weighted V-ups<\/b><\/p><\/li><li><p><b>Max Dead Hang<\/b><\/p><\/li><\/ul><p>→ Rest 1 minute between rounds<\/p><hr><h4><b>Accessory Block<\/b><\/h4><ul><li><p><b>DB Bench Press<\/b> – 4x8<\/p><\/li><li><p><b>DB Front Raise<\/b> – 4x8<\/p><\/li><\/ul><hr><h3><b>Aerobic Option<\/b><\/h3><p>Pick your path to sweat:<\/p><p><b>Option 1: Conditioning Tri-Set<\/b><br>5 Rounds:<\/p><ul><li><p>3 min <b>Row<\/b><\/p><\/li><li><p>3 min <b>Ski<\/b><\/p><\/li><li><p>3 min <b>Bike or Run<\/b><\/p><\/li><\/ul><p><b>Option 2: Aerobic Run<\/b><\/p><ul><li><p>50 min steady @ Z2/Low Z3<\/p><\/li><\/ul><hr><h4><b>Coaching Tips<\/b><\/h4><p>You don’t need to crush every set. You need to be intentional.<br>This session builds tendon strength, running power, and posture under fatigue. Pay attention to the details: tempo, control, and form matter.<\/p><hr><h4><b>Quote of the Day<\/b><\/h4><blockquote><p>“Strength doesn’t come from what you can do. It comes from overcoming the things you once thought you couldn’t.”<\/p><\/blockquote>"}, {"id": 2496875, "di": 1, "day": "Tuesday", "title": "Threshold with Float – Control the Burn", "tags": ["threshold"], "html": "<p>This one’s about building endurance at intensity. Threshold work teaches your body how to handle sustained effort while staying smooth. Float recoveries keep you honest.<\/p><hr><h4><b>Prep<\/b><\/h4><ul><li><p>5 minutes <b>Backwards Walking<\/b><\/p><\/li><li><p><b>Happy Hip Mobility<\/b><\/p><\/li><li><p><b>Marching Drills<\/b><\/p><ul><li><p>A-Skips<\/p><\/li><li><p>B-Skips<\/p><\/li><\/ul><\/li><\/ul><hr><h4><b>Warm-Up<\/b><\/h4><ul><li><p>10–15 minutes <b>easy aerobic run<\/b><br>(Z2 pace — shake out the legs, settle into rhythm)<\/p><\/li><li><p><b>Strides:<\/b><br>6 x 100m strides @ 90% effort<br>→ Focus on clean, efficient running form<br>→ 60 seconds rest between each<\/p><\/li><\/ul><hr><h4><b>Main Set: Threshold with Float<\/b><\/h4><p><b>3–4 rounds:<\/b><\/p><ul><li><p>1600m @ <b>Threshold pace<\/b> (Z4 HR / RPE 7-8)<\/p><\/li><li><p>400m “float” recovery @ your regular Z2 pace<br>→ This is a <b>running recovery<\/b> — not a shuffle, not a jog, but controlled and rhythmic.<\/p><\/li><\/ul><hr><h4><b>Rest<\/b><\/h4><ul><li><p>2 minutes <b>passive rest<\/b> (walk, hydrate, reset)<\/p><\/li><\/ul><hr><h4><b>Cool Down<\/b><\/h4><ul><li><p>10–15 minutes <b>easy aerobic run<\/b><br>→ Settle the heart rate, bring the system down gradually<\/p><\/li><\/ul><hr><h4><b>Coaching Tips<\/b><\/h4><p>Threshold running is where progress happens — right on the edge of comfort and fatigue. Don’t blow up early. Stay in control, stay smooth. The float keeps the body moving while simulating race fatigue. This is how you build race-day gears.<\/p><hr><h4><b>Quote of the Day<\/b><\/h4><blockquote><p>“You don’t rise to the occasion. You fall to the level of your training. Train well.”<\/p><\/blockquote>"}, {"id": 2496876, "di": 2, "day": "Wednesday", "title": "Mechanical Fartlek – Smooth Operator Mode", "tags": ["aerobic"], "html": "<p>We're not sprinting. We're not slogging. This one is about <b>controlled variation<\/b> — shifting gears without leaving Zone 2. Precision &gt; Pace.<\/p><hr><h4><b>Mobility Prep – Kruse + Static Stretch Flow<\/b><\/h4><ul><li><p><b>Foot Roll<\/b><\/p><\/li><li><p><b>Ankle Roll<\/b> (Out / In / Back)<\/p><\/li><li><p><b>Hip Roll<\/b><\/p><\/li><li><p><b>Knee Roll<\/b><\/p><\/li><li><p><b>Front Hip Roll<\/b><\/p><\/li><\/ul><p>Then move into:<\/p><ul><li><p><b>Pec Stretch<\/b><\/p><\/li><li><p><b>Lat Stretch (Prayer Pose)<\/b><\/p><\/li><li><p><b>Couch Stretch<\/b><\/p><\/li><li><p><b>Knight Stretch<\/b><\/p><\/li><li><p><b>Pigeon Pose<\/b><\/p><\/li><\/ul><hr><h4><b>Main Set: Mechanical Fartlek – 40 min Continuous<\/b><\/h4><p><b>Alternating every 5 minutes:<\/b><\/p><ul><li><p>3 minutes <b>uptempo<\/b> (smooth, with great form — HR cap 180-age or 75% Max HR)<\/p><\/li><li><p>2 minutes <b>easy<\/b> running (still with perfect form, just slower by 10–20 seconds/mile)<\/p><\/li><\/ul><p>🔁 Repeat this rhythm for the full 40 minutes. No walking. No slouching. Just flow.<\/p><hr><h4><b>Aerobic Option (Cross-Train if Needed)<\/b><\/h4><ul><li><p>30 min <b>Easy Cycling<\/b><br>→ Zone 2 effort. Smooth cadence. Think rhythm, not speed.<\/p><\/li><\/ul><hr><h4><b>Coaching Tips<\/b><\/h4><p>This run sharpens your mechanics under subtle fatigue. Stay honest. If your form breaks down in the 3-minute sections, back off. We’re training <b>efficiency<\/b>, not hero pace. This is stealth fitness at its finest.<\/p><hr><h4><b>Quote of the Day<\/b><\/h4><blockquote><p>“Speed is nothing without control. Flow now, fly later.”<\/p><\/blockquote>"}, {"id": 2496877, "di": 3, "day": "Thursday", "title": "Speed & Strength — Precision + Power", "tags": ["speed", "strength"], "html": "<p>We’re training fast, but smart. Strength work designed to make you explosive. Speed work designed to keep you smooth. Don’t let your ego race ahead of your form. Today is about <i>control under effort<\/i>.<\/p><hr><h4><b>PREP<\/b><\/h4><ul><li><p>5 minutes <b>Backwards Walking<\/b><\/p><\/li><li><p><b>Happy Hip Sequence<\/b><\/p><\/li><li><p><b>Marching Running Drills<\/b><\/p><ul><li><p>A-Skips<\/p><\/li><li><p>B-Skips<\/p><\/li><\/ul><\/li><\/ul><hr><h4><b>Part 1: Running Strength Day<\/b><\/h4><p><b>Heels Elevated Eccentric Tempo: 4/2/1/1<\/b><br>(Slow down, hold, control the rise — own every rep)<\/p><ul><li><p><b>Tibialis Raise<\/b> – 1 x 30<\/p><\/li><li><p><b>Calf Raise<\/b> – 1 x 20–30 each leg<\/p><\/li><li><p><b>Paloquin Step Up<\/b> – 2 x 20<\/p><\/li><li><p><b>ATG Lunges<\/b> – 3 x 10<\/p><\/li><\/ul><p><b>Super Set:<\/b><\/p><ul><li><p>Calf Isometric – 3 x 3 sec<\/p><\/li><li><p>Jefferson Curls – 3 x 3 reps<\/p><\/li><\/ul><p><b>Power + Plyo Work:<\/b><\/p><ul><li><p><b>Single Leg Box Jump<\/b> (stack plates or low box) – 3 x 2<\/p><\/li><li><p><b>Standing Broad Jump<\/b> – 3 x 3<\/p><\/li><li><p><b>Barbell Reverse Lunge<\/b> – 5 x 5 @ 60–75% (move with <i>speed<\/i>)<br>→ Rest 90–120 sec<\/p><\/li><li><p><b>Sled Pull<\/b> – 3 x 25m @ slightly heavier than race weight<\/p><\/li><\/ul><hr><h4><b>Part 2: Flat Speed Session<\/b><\/h4><p><b>10–15 min Easy Aerobic Run (Warm-up)<\/b><\/p><p><b>Strides:<\/b><\/p><ul><li><p>4 x 100m strides @ ~90% sprint form<br>→ Rest 60 sec between<\/p><\/li><\/ul><p><b>Speed Intervals:<\/b><\/p><ul><li><p>2 x 300m @ as fast as possible <b>in distance form<\/b><br>→ Rest 2 min between<\/p><\/li><li><p>3 x 150m @ max controlled pace<br>→ Rest 2 min between<\/p><\/li><\/ul><p><b>10–15 min Easy Aerobic Run (Cool down)<\/b><\/p><hr><h4><b>Coaching Tips<\/b><\/h4><p>This is not max sprinting — it's <b>max speed in your best distance form<\/b>. Once your form breaks, the value drops. That’s your limiter today, not your lungs. Trust the structure.<\/p><hr><h4><b>Quote of the Day<\/b><\/h4><blockquote><p>“You don’t rise to the level of your speed — you fall to the quality of your form.”<\/p><\/blockquote>"}, {"id": 2496878, "di": 4, "day": "Friday", "title": "Rest", "tags": ["rest"], "html": ""}, {"id": 2496879, "di": 5, "day": "Saturday", "title": "Threshold Tempo Grind — Fatigue Meets Focus", "tags": ["threshold"], "html": "<p>This one's a test of composure under pressure. Run hard, recover smart. We’re pushing effort in Z4, but with form and control. Remember: the machines and movements aren’t breaks — they’re your built-in regroup zones.<\/p><hr><h4><b>PREP<\/b><\/h4><ul><li><p>5 minutes <b>Backwards Walking<\/b><\/p><\/li><li><p><b>Happy Hip Sequence<\/b><\/p><\/li><li><p><b>Marching Running Drills<\/b><\/p><ul><li><p>A-Skips<\/p><\/li><li><p>B-Skips<\/p><\/li><\/ul><\/li><\/ul><hr><h4><b>THRESHOLD TEMPO SESSION<\/b><\/h4><p><b>Warm-Up<\/b><\/p><ul><li><p>10–15 min <b>Easy Aerobic Run<\/b><\/p><\/li><li><p>5 x 100m <b>Strides<\/b> (90% effort in perfect distance running form)<br>→ Rest 60 sec between strides<\/p><\/li><\/ul><hr><p><b>Main Set: 45 Min AMRAP<\/b><\/p><ul><li><p>800m Run<\/p><\/li><li><p>500m Sled Push<\/p><\/li><li><p>800m Run<\/p><\/li><li><p>60m Burpee Broad Jump (BBJ)<\/p><\/li><li><p>800m Run<\/p><\/li><li><p>500m Row<\/p><\/li><\/ul><p><i>Work at low Zone 4 — it should feel “comfortably uncomfortable.” Push your run effort slightly; use stations to reset your breath without losing intent.<\/i><\/p><hr><p><b>Rest 2 minutes<\/b><\/p><hr><p><b>Cool Down<\/b><\/p><ul><li><p>10–15 min <b>Easy Aerobic Run<\/b><\/p><\/li><\/ul><hr><h4><b>Coaching Tips<\/b><\/h4><p>This is all about <b>pacing under pressure<\/b>. You’re going to feel that build of fatigue — especially on the second and third runs. That’s the moment to lean in. Stay tall, stay smooth, and find that gear between pushing and surviving.<\/p><hr><h4><b>Quote of the Day<\/b><\/h4><blockquote><p>“Fatigue makes cowards of us all — unless we train through it.”<\/p><\/blockquote>"}, {"id": 2496880, "di": 6, "day": "Sunday", "title": "Endurance + Efficiency Builder", "tags": ["aerobic"], "html": "<p>This is a double-dose aerobic day — not about speed, but about form, rhythm, and staying in control. Think of it as a skill session disguised as conditioning.<\/p><hr><h4><b>Mobility (Kruse + Static Stretch)<\/b><\/h4><p>Prep and recovery rolled into one. Don’t rush this — your joints and fascia will thank you.<\/p><ul><li><p><b>Foot Roll<\/b><\/p><\/li><li><p><b>Ankle Roll (Out/In/Back)<\/b><\/p><\/li><li><p><b>Hip Roll<\/b><\/p><\/li><li><p><b>Knee Roll<\/b><\/p><\/li><li><p><b>Front Hip Roll<\/b><\/p><\/li><\/ul><p><b>Then:<\/b><\/p><ul><li><p><b>Standing Stretch<\/b><\/p><\/li><li><p><b>Laying Pec Stretch<\/b><\/p><\/li><li><p><b>Butterfly Stretch<\/b><\/p><\/li><li><p><b>90/90<\/b><\/p><\/li><li><p><b>Pigeon Pose<\/b><\/p><\/li><\/ul><hr><h4><b>Easy Run<\/b><\/h4><ul><li><p><b>55–60 min<\/b> @ Z2/Low Z3<\/p><\/li><li><p>Focus on <b>perfect form<\/b>, steady breathing, and relaxed cadence.<\/p><\/li><li><p>This should feel easy — because easy is the point.<\/p><\/li><\/ul><hr><h4><b>Then: Bike Finish<\/b><\/h4><ul><li><p><b>30–35 min Easy Cycling<\/b><\/p><\/li><li><p>Smooth, steady, conversational pace. Legs should be moving but not grinding.<\/p><\/li><\/ul><hr><h4><b>Coaching Tip<\/b><\/h4><p>\"Faster is not better here.\"<br>This is where your aerobic engine gets built — by staying efficient, relaxed, and consistent. The form you keep on these runs is what shows up under fatigue later.<\/p>"}, {"id": 3409997, "di": 6, "day": "Sunday", "title": "Sunday Recap – Week 7: Reflections", "tags": ["recap"], "recap": {"prompt": "Which workout challenged you the most this week, and why?", "sub": "", "example": "The threshold session this week felt tough! I had trouble sustaining a similar effort on each rep. But I know if I keep putting the work in, the runs will feel easier over time."}}]}, {"n": 8, "label": "W8", "name": "Week 8", "sessions": [{"id": 2496881, "di": 0, "day": "Monday", "title": "De-load Week — Running Strength + Aerobic Flow", "tags": ["strength", "aerobic"], "html": "<p>This week is all about dialing it back just enough to recover while keeping the engine warm. We’re still moving, still building, but with intention and less intensity. Quality &gt; quantity.<\/p><hr><h4><b>PREP<\/b><\/h4><p>Start slow and stay focused on activation and movement quality:<\/p><ul><li><p><b>5 minutes Backwards Walking<\/b><\/p><\/li><li><p><b>Marching Running Drills:<\/b><\/p><ul><li><p>A-Skips<\/p><\/li><li><p>B-Skips<\/p><\/li><\/ul><\/li><\/ul><hr><h4><b>Running Strength Day<\/b><\/h4><p>This is still strength — but not maximal. We’re keeping sharp and powerful without overreaching.<\/p><p><b>Heels Elevated Eccentric Squats (4/2/1/1 tempo)<\/b><\/p><ul><li><p>Control is the name of the game. Think: strong descent, pause, explode up.<\/p><\/li><\/ul><p><b>Then, move through:<\/b><\/p><ul><li><p><b>Tibialis Raise<\/b> – 1x30<\/p><\/li><li><p><b>Calf Raise<\/b> – 1x20-30 each leg<\/p><\/li><li><p><b>Paloquin Step Up<\/b> – 2x20<\/p><\/li><li><p><b>ATG Lunges<\/b> – 3x10<\/p><\/li><\/ul><hr><h4><b>Super Set<\/b><\/h4><ul><li><p><b>Calf Isometric<\/b> – 3x3 seconds<\/p><\/li><li><p><b>Jefferson Curls<\/b> – 3x3 reps<br>(Use light weight or bodyweight — focus on spinal control.)<\/p><\/li><\/ul><hr><h4><b>Power &amp; Plyo Block<\/b><\/h4><ul><li><p><b>Sled Push<\/b> – 1 x 50m @ Steady, Unbroken<\/p><\/li><li><p><b><a href=\"https://youtu.be/U1F5uebdUcw\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Single Leg Broad Jump<\/a><\/b> – 3x2<\/p><\/li><li><p><b><a href=\"https://youtu.be/j260zYfRz8Q\" target=\"_blank\" rel=\"noopener\" class=\"vid\">Standing Vertical Jump<\/a><\/b> – 3x2<\/p><\/li><\/ul><hr><h4><b>Strength Work<\/b><\/h4><ul><li><p><b>Deadlift<\/b> – 3x5 @ 80–85%<br><i>(Rest 90–120 sec. Crisp reps, solid form.)<\/i><\/p><\/li><\/ul><p><b>Super Set:<\/b><\/p><ul><li><p><b>Heels Elevated Goblet Squat x15<\/b><\/p><\/li><li><p><b>Pull-up x 2 RIR<\/b><\/p><\/li><\/ul><hr><h4><b>Accessory Finisher<\/b><\/h4><ul><li><p><b>Toes to Bar x 2 RIR<\/b><\/p><\/li><li><p><b>Push-ups x 2 RIR<\/b><\/p><\/li><\/ul><hr><h4><b>Aerobic Option<\/b><\/h4><p><b>Choose one:<\/b><\/p><p>3–4 Rounds<\/p><ul><li><p>3 min Row<\/p><\/li><li><p>3 min Ski<\/p><\/li><li><p>3 min Bike or Run<\/p><\/li><\/ul><p>Nice and easy — don’t chase intensity here. Let it be smooth and rhythmic.<\/p><hr><h4><b>Coaching Tip<\/b><\/h4><p>De-load doesn’t mean “do nothing.” It means do less, better. This is where the real gains are solidified. Use this week to recover, refine, and reset.<\/p>"}, {"id": 2496882, "di": 1, "day": "Tuesday", "title": "Threshold with Float", "tags": ["threshold"], "html": "<p>We’re living in the gap today — that space between “comfortable” and “pushing it.” This is a threshold workout designed to sharpen your ability to hold strong effort and recover while still running. Float means <i>keep moving<\/i>, not <i>stop moving<\/i>.<\/p><hr><h4><b>PREP<\/b><\/h4><ul><li><p><b>10–15 min easy aerobic run<\/b><br>Get loose, settle into your rhythm, and dial into your body.<\/p><\/li><li><p><b>4 x 100m Strides<\/b><br>(90% effort, perfect distance running form)<\/p><\/li><li><p>Rest 60 seconds between strides<\/p><\/li><\/ul><hr><h4><b>MAIN WORKOUT<\/b><\/h4><p><b>4–6 rounds:<\/b><\/p><ul><li><p>800m @ <b>Threshold pace<\/b> (Zone 4 HR / RPE 8)<\/p><\/li><li><p>200m <b>Float recovery<\/b><br><i>(Z2 pace — not a jog, not a walk. Keep it clean.)<\/i><\/p><\/li><\/ul><hr><h4><b>COOL DOWN<\/b><\/h4><ul><li><p><b>10–15 min easy aerobic run<\/b><br>Let the engine simmer down. Breathe. Reset.<\/p><\/li><\/ul><hr><h4><b>Coaching Tips<\/b><\/h4><p>Threshold work trains your ability to hang tough. The 800s are the work. The 200s are the skill — staying composed, recovering <i>while<\/i> running, and learning to breathe through fatigue.<\/p><p>Your form is the priority. If you can't keep it clean, back off the pace.<\/p><p>📣 <i>“Train at your edge, not over it.”<\/i><\/p>"}, {"id": 2496883, "di": 2, "day": "Wednesday", "title": "Movement Prep & Activation", "tags": ["mobility"], "html": "<p>Start here to open the hips, prime the joints, and fire up running mechanics.<\/p><ul><li><p><b>5 minutes Backwards Walking<\/b><br>Loosen up ankles, knees, hips — and get that posterior chain ready.<\/p><\/li><li><p><b>Happy Hip Flow<\/b><br>Dynamic hip openers to create space and range.<\/p><\/li><li><p><b>Marching &amp; Running Drills:<\/b><\/p><ul><li><p><b>A-Skips<\/b><\/p><\/li><li><p><b>B-Skips<\/b><\/p><\/li><\/ul><\/li><\/ul><p>🎯 Focus on posture, rhythm, and intentional movement. Think of this as your switch flipping from “day mode” to “training mode.”<\/p><blockquote><p><i>“If you don’t have time to prep, you don’t have time to perform.”<\/i><\/p><\/blockquote>"}, {"id": 2496884, "di": 3, "day": "Thursday", "title": "Mobility (Kruse + Static Stretch)", "tags": ["mobility"], "html": "<p>Restore range. Unlock movement. Make this a non-negotiable.<\/p><p><b>Sequence:<\/b><\/p><ul><li><p>Foot Roll<\/p><\/li><li><p>Ankle Roll (Out / In / Back)<\/p><\/li><li><p>Hip Roll<\/p><\/li><li><p>Knee Roll<\/p><\/li><li><p>Front Hip Roll<\/p><\/li><\/ul><p><b>Static Stretches:<\/b><\/p><ul><li><p>Pec Stretch (Lying)<\/p><\/li><li><p>Lat Stretch (Prayer)<\/p><\/li><li><p>Couch Stretch<\/p><\/li><li><p>Knight Stretch<\/p><\/li><li><p>Pigeon Pose<\/p><\/li><\/ul><blockquote><p><i>\"You don’t get stronger by doing more. You get stronger by recovering better.\"<\/i><\/p><\/blockquote><hr><h3><b>Workout Title: Mechanical Fartlek<\/b><\/h3><p><b>Duration:<\/b> 40 mins total<br><b>Format:<\/b><\/p><ul><li><p>3 min <i>uptempo<\/i> w/ perfect form<\/p><\/li><li><p>2 min <i>controlled<\/i> effort (10–20s slower per mile than uptempo)<\/p><\/li><li><p>Stay in <b>Zone 2<\/b> the entire time — smooth and efficient<\/p><\/li><\/ul><p><b>Coaching Tips:<\/b><br>This is all about running mechanics under light stress. Stay focused on rhythm and posture. Don’t chase speed. Control the effort and feel sharp. Fartlek runs like this sharpen your stride and raise your floor—without wrecking your body.<\/p><blockquote><p><i>“Discipline isn’t loud. It’s you showing up, doing the boring stuff well.”<\/i><\/p><\/blockquote>"}, {"id": 2496885, "di": 4, "day": "Friday", "title": "Rest Day", "tags": ["rest"], "html": ""}, {"id": 2496886, "di": 5, "day": "Saturday", "title": "Hill Sprint + Aerobic Combo", "tags": ["speed", "aerobic"], "html": "<h4><b>Prep<\/b><\/h4><p>Start by opening the body up and getting everything firing:<\/p><ul><li><p>5 minutes Backwards Walking<\/p><\/li><li><p>Happy Hip<\/p><\/li><li><p>Marching + Running Drills:<\/p><ul><li><p>A-Skips<\/p><\/li><li><p>B-Skips<\/p><\/li><\/ul><\/li><\/ul><hr><h4><b>Main Session: Hill Sprints<\/b><\/h4><p><b>Warm-up:<\/b><br>10–15 minutes easy aerobic run (use this to get to your hill)<\/p><p><b>Sprints:<\/b><br>6 x 30 seconds uphill<\/p><ul><li><p>Walk or jog slowly to the bottom after each<\/p><\/li><li><p>Focus on posture, drive, and a smooth, powerful stride<\/p><\/li><li><p>Build each rep to near sprint pace — but do <b>not<\/b> go full-send on rep one. Let the effort rise each round.<\/p><\/li><\/ul><p><b>Cool-down Aerobic:<\/b><br>20–30 minutes easy run (stay relaxed, nose-breathing if you can)<\/p><hr><h4><b>Coaching Tips<\/b><\/h4><p>Hill sprints are your secret weapon. Low impact on joints, high return for power and stride efficiency. These are short enough not to wreck your engine, but intense enough to demand focus.<\/p><blockquote><\/blockquote>"}, {"id": 2496887, "di": 6, "day": "Sunday", "title": "Easy Run + Mobility Reset", "tags": ["aerobic", "mobility"], "html": "<h4><b>Mobility (Kruse + Static Stretch Flow)<\/b><\/h4><p><b>Roll and Loosen:<\/b><\/p><ul><li><p>Foot Roll<\/p><\/li><li><p>Ankle Roll (out/in/back)<\/p><\/li><li><p>Hip Roll<\/p><\/li><li><p>Knee Roll<\/p><\/li><li><p>Front Hip Roll<\/p><\/li><\/ul><p><b>Stretch + Open Up:<\/b><\/p><ul><li><p>Standing Stretch<\/p><\/li><li><p>Laying Pec Stretch<\/p><\/li><li><p>Butterfly<\/p><\/li><li><p>90/90<\/p><\/li><li><p>Pigeon Pose<\/p><\/li><\/ul><hr><h4><b>Easy Run<\/b><\/h4><p><b>40–50 minutes @ Zone 2 / Low Zone 3<\/b><br>This is conversational effort. Don’t chase speed—chase efficiency. Relax into the rhythm and focus on maintaining smooth, perfect form.<\/p><hr><h4><b>Coaching Tips<\/b><\/h4><p>Slower is often smarter. These runs lay your aerobic foundation and build durability without breaking you down.<\/p><blockquote><p><i>“Fast is earned by mastering slow.”<\/i><\/p><\/blockquote><p>Perfect form. Gentle cadence. Time on your feet is what matters today.<\/p>"}, {"id": 3410155, "di": 6, "day": "Sunday", "title": "Sunday Recap – Week 8: Recovery", "tags": ["recap"], "recap": {"prompt": "How did you take care of yourself this week to support your running?", "sub": "(Recovery choices, rest, boundaries, or anything that helped you show up feeling better.)", "example": "I was more intentional about giving myself extra sleep and not stacking hard days back to back. Treating recovery as part of training made my runs feel calmer and more controlled."}}]}, {"n": 9, "label": "W9", "name": "Week 9", "sessions": [{"id": 2496888, "di": 0, "day": "Monday", "title": "MAF Benchmark – 5K Aerobic Test", "tags": ["test", "aerobic"], "special": "maf", "html": "<h4><b>Warm-Up<\/b><\/h4><p>15 minutes easy aerobic running (run is preferred)<br>Move well, stay relaxed, and gradually build toward your target HR.<\/p><hr><h4><b>MAF Test<\/b><\/h4><p><b>5K for time<\/b><br>Maintain MAF heart rate throughout (180 – your age). Use a flat track, treadmill, or path—whichever you used last time. Keep conditions consistent so you can compare progress.<\/p><p>Take your 1000m splits to track pacing across the effort.<br><b>Reminder:<\/b> The test <i>doesn’t start<\/i> until your heart rate reaches the target zone.<\/p><hr><h4><b>Cool-Down<\/b><\/h4><p>10–15 minutes easy aerobic effort to bring the heart rate back down and recover.<\/p><hr><h4><b>Coaching Tips<\/b><\/h4><p>This isn’t a race—it’s a check-in. Stay patient and focused on <i>form<\/i> and <i>feel<\/i>. You might want to go faster, but the goal is steady, controlled effort at a consistent aerobic output.<\/p><blockquote><p><i>“You don’t need to prove fitness—you’re building it.”<\/i><\/p><\/blockquote><p>We’ll retest over time to see how your pace improves at the same effort. That’s the true win.<\/p>"}, {"id": 2496889, "di": 1, "day": "Tuesday", "title": "Threshold with Float – Progression Week", "tags": ["threshold"], "html": "<h4><b>Prep<\/b><\/h4><ul><li><p>5 minutes backward walking<\/p><\/li><li><p>Happy Hip Series<\/p><\/li><li><p>Marching drills:<\/p><ul><li><p>A-Skips<\/p><\/li><li><p>B-Skips<\/p><\/li><\/ul><\/li><\/ul><hr><h4><b>Main Set<\/b><\/h4><p><b>10–15 min easy aerobic run<\/b><br>Ease in. Let your body find rhythm and range.<\/p><p><b>6 x 100m strides<\/b><br>90% effort in clean, efficient distance form<\/p><ul><li><p>Rest 60 sec between reps<\/p><\/li><\/ul><hr><h4><b>Threshold Work<\/b><\/h4><p><b>7–9 x 1000m @ Threshold (Z4 HR)<\/b><\/p><ul><li><p>200m “float” recovery after each<\/p><\/li><li><p>Float = Z2 pace, not a jog<\/p><\/li><li><p><b>Goal<\/b>: Run each 1000m faster than last week’s 1600s pace<\/p><\/li><\/ul><p><b>Rest 2 min<\/b> after your final rep<\/p><hr><h4><b>Cool Down<\/b><\/h4><p>10–15 min easy aerobic jog<br>Unwind, reset, and process the work<\/p><hr><h4><b>Coaching Tips<\/b><\/h4><ul><li><p>Control the effort early so you can finish strong<\/p><\/li><li><p>“Float” means moving—keep posture and cadence consistent<\/p><\/li><li><p>Watch your HR drift—if it spikes, you're pushing too hard<\/p><\/li><li><p>Focus on relaxed arms, tall posture, and efficient turnover<\/p><\/li><\/ul><blockquote><p><i>“Hold form. Hold rhythm. When it gets tough—breathe, don’t force.”<\/i><\/p><\/blockquote>"}, {"id": 2496890, "di": 2, "day": "Wednesday", "title": "Mechanical Fartlek + Mobility", "tags": ["aerobic", "mobility"], "html": "<h4><b>Mobility (Kruse + Static Stretch)<\/b><\/h4><p>Reset the system before you hit the work.<\/p><p><b>Roll &amp; Mobilize<\/b><\/p><ul><li><p>Foot Roll<\/p><\/li><li><p>Ankle Roll (Out / In / Back)<\/p><\/li><li><p>Hip Roll<\/p><\/li><li><p>Knee Roll<\/p><\/li><li><p>Front Hip Roll<\/p><\/li><\/ul><p><b>Stretch &amp; Open<\/b><\/p><ul><li><p>Pec Stretch (Lying)<\/p><\/li><li><p>Lat Stretch (Prayer Pose)<\/p><\/li><li><p>Couch Stretch<\/p><\/li><li><p>Knight Stretch<\/p><\/li><li><p>Pigeon Pose<\/p><\/li><\/ul><hr><h4><b>Mechanical Fartlek – 40 Min Run<\/b><\/h4><p>Alternate effort without breaking your form.<\/p><ul><li><p><b>3 min uptempo<\/b> (HR cap: 180 - age or ~75% Max HR)<\/p><\/li><li><p><b>2 min controlled pace<\/b>, 10–20 seconds/mile slower<\/p><\/li><li><p>Repeat continuously for 40 minutes<\/p><\/li><li><p><b>Stay in Zone 2<\/b> for the entire run<\/p><\/li><\/ul><p>Think of this as a rhythm run, not a speed workout. The goal is control, posture, and mechanics—perfect form at every pace.<\/p><blockquote><p><i>“Speed is nothing without control. Form first, always.”<\/i><\/p><\/blockquote><hr><h4><b>Aerobic Option<\/b><\/h4><p>Not feeling the run today? Swap in:<br><b>30 min steady-state cycling<\/b><\/p>"}, {"id": 2496891, "di": 3, "day": "Thursday", "title": "Running Strength + Flat Speed Development", "tags": ["speed", "strength"], "html": "<h4><b>Prep<\/b><\/h4><p>Set the tone with movement and rhythm.<\/p><ul><li><p>5 min Backwards Walking<\/p><\/li><li><p>Happy Hip<\/p><\/li><li><p>Marching<\/p><\/li><li><p>A-Skips<\/p><\/li><li><p>B-Skips<\/p><\/li><\/ul><hr><h4><b>Running Strength Day<\/b><\/h4><p>Build power, control, and running-specific force.<\/p><p><b>Prep &amp; Prime<\/b><\/p><ul><li><p>Heels Elevated Eccentric Calf Raise 4/2/1/1<\/p><\/li><li><p>Tibialis Raise – 1 x 30<\/p><\/li><li><p>Calf Raise – 1 x 20-30 per leg<\/p><\/li><li><p>Paloquin Step Up – 2 x 20<\/p><\/li><li><p>ATG Lunges – 3 x 10<\/p><\/li><\/ul><p><b>Super Set<\/b><\/p><ul><li><p>Calf Isometric – 3 x 3 sec hold<\/p><\/li><li><p>Jefferson Curls – 3 x 3<\/p><\/li><\/ul><p><b>Explosive Power<\/b><\/p><ul><li><p>Single Leg Box Jump – 3 x 2 (stack plates or use low box)<\/p><\/li><li><p>Standing Broad Jump – 3 x 3<\/p><\/li><\/ul><p><b>Strength Block<\/b><\/p><ul><li><p>Barbell Reverse Lunge – 5 x 5 @ 60–75% (fast and sharp reps)<\/p><\/li><li><p>Rest 90–120 seconds<\/p><\/li><\/ul><p><b>Engine Builder<\/b><\/p><ul><li><p>Sled Pull – 3 x 25m @ slightly heavier than race weight<\/p><\/li><\/ul><hr><h4><b>Flat Speed Development<\/b><\/h4><p>Finish with fast strides under control.<\/p><p><b>Warm-up<\/b><\/p><ul><li><p>10–15 min easy aerobic run<\/p><\/li><li><p>4 x 100m strides (90% effort w/ perfect form)<\/p><\/li><li><p>Rest 60s between<\/p><\/li><\/ul><p><b>Main Set<\/b><\/p><ul><li><p>3 x 250m @ as fast as possible in distance form<\/p><ul><li><p>2 min rest between<\/p><\/li><\/ul><\/li><li><p>4 x 150m @ fast pace, perfect distance form<\/p><ul><li><p>2 min rest between<\/p><\/li><\/ul><\/li><\/ul><p><b>Cool Down<\/b><\/p><ul><li><p>10–15 min easy aerobic run<\/p><\/li><\/ul><hr><h4><b>Coaching Tips<\/b><\/h4><ul><li><p>Don’t push into full sprint form—this is <i>fast distance running<\/i>, not track sprinting.<\/p><\/li><li><p>Keep posture tall, arms compact, and cadence crisp.<\/p><\/li><li><p>Think “smooth is fast.” Stay efficient when tired.<\/p><\/li><\/ul><blockquote><p><i>\"Speed is only good if you can control it. Form is king.\"<\/i><\/p><\/blockquote>"}, {"id": 2496892, "di": 4, "day": "Friday", "title": "Rest Day", "tags": ["rest"], "html": ""}, {"id": 2496893, "di": 5, "day": "Saturday", "title": "Threshold + Machine Work", "tags": ["threshold", "hyrox"], "html": "<h4><b>Prep<\/b><\/h4><p>Get the body firing in all the right directions.<\/p><ul><li><p>5 min Backwards Walking<\/p><\/li><li><p>Happy Hip<\/p><\/li><li><p>Marching<\/p><\/li><li><p>A-Skips<\/p><\/li><li><p>B-Skips<\/p><\/li><\/ul><hr><h4><b>Main Session<\/b><\/h4><p><b>Easy Aerobic Warm-Up<\/b><\/p><ul><li><p>10–15 min easy aerobic run<\/p><\/li><li><p>5 x 100m strides (90% effort, perfect distance form)<\/p><ul><li><p>Rest 60 sec between each<\/p><\/li><\/ul><\/li><\/ul><hr><p><b>Machine + Threshold Combo<\/b><br>Push the engine without sacrificing form.<\/p><p><b>Ski Erg<\/b><\/p><ul><li><p>1 x 1000m @ threshold pace<\/p><ul><li><p>60 sec rest<\/p><\/li><\/ul><\/li><li><p>1 x 750m @ threshold pace<\/p><ul><li><p>60 sec rest<\/p><\/li><\/ul><\/li><\/ul><p><b>Row Erg<\/b><\/p><ul><li><p>1 x 1000m @ threshold pace<\/p><ul><li><p>60 sec rest<\/p><\/li><\/ul><\/li><li><p>1 x 750m @ threshold pace<\/p><ul><li><p>60 sec rest<\/p><\/li><\/ul><\/li><\/ul><p><b>Run (Treadmill or controlled outdoor course)<\/b><\/p><ul><li><p>3 x 1200m @ threshold pace<\/p><ul><li><p>60 sec rest<\/p><\/li><\/ul><\/li><\/ul><hr><p><b>Cool-Down<\/b><\/p><ul><li><p>10–15 min easy aerobic run<\/p><\/li><\/ul><hr><h4><b>Coaching Tips<\/b><\/h4><ul><li><p>We’re taking threshold effort into fatigue—this is where you sharpen your mental edge.<\/p><\/li><li><p>Focus on clean, consistent running form <i>after<\/i> the machines—this simulates race fatigue.<\/p><\/li><li><p>Trust your engine. You’ve built the base—now lean into it and test that line between “strong” and “too fast.”<\/p><\/li><li><p>Use a treadmill if needed so transitions are tight and controlled.<\/p><\/li><\/ul><blockquote><p><i>“You don’t rise to the occasion—you fall to your level of preparation. Let’s raise that floor.”<\/i><\/p><\/blockquote>"}, {"id": 2496894, "di": 6, "day": "Sunday", "title": "Long Easy + Mobility Reset", "tags": ["aerobic", "mobility"], "html": "<h4><b>Mobility (Kruse + Static Stretch)<\/b><\/h4><p>Ease in. Take your time. Prime the joints and tissues.<\/p><ul><li><p>Foot Roll<\/p><\/li><li><p>Ankle Roll (Out / In / Back)<\/p><\/li><li><p>Hip Roll<\/p><\/li><li><p>Knee Roll<\/p><\/li><li><p>Front Hip Roll<\/p><\/li><\/ul><p><b>Static Work:<\/b><\/p><ul><li><p>Standing Stretch<\/p><\/li><li><p>Laying Pec Stretch<\/p><\/li><li><p>Butterfly<\/p><\/li><li><p>90/90<\/p><\/li><li><p>Pigeon Pose<\/p><\/li><\/ul><hr><h4><b>Easy Run<\/b><\/h4><p><b>60 minutes @ Z2/Low Z3<\/b><\/p><ul><li><p>The goal here is <i>time on feet<\/i>, not pace.<\/p><\/li><li><p>Hold perfect form, stay relaxed, and let your breath guide your effort.<\/p><\/li><\/ul><hr><h4><b>Bonus Aerobic Option<\/b><\/h4><p><b>30–35 min Easy Cycling<\/b><\/p><ul><li><p>Use this as active recovery or low-impact aerobic volume.<\/p><\/li><li><p>Spin light and steady.<\/p><\/li><\/ul><hr><h4><b>Coaching Tips<\/b><\/h4><ul><li><p>Faster isn't better—smoother is.<\/p><\/li><li><p>Think about posture, arm swing, cadence. Every step is a chance to build better mechanics.<\/p><\/li><li><p>This work builds durability, resilience, and aerobic depth—don’t sleep on it.<\/p><\/li><\/ul><blockquote><p><i>“Speed is earned. Efficiency is built. Show up and put in the quiet work.”<\/i><\/p><\/blockquote>"}, {"id": 3410168, "di": 6, "day": "Sunday", "title": "Sunday Recap – Week 9: Habits", "tags": ["recap"], "recap": {"prompt": "What’s helping you handle running volume or frequency better right now?", "sub": "", "example": "Spacing runs out and keeping some truly easy has helped me feel more durable week to week."}}]}, {"n": 10, "label": "W10", "name": "Week 10", "sessions": [{"id": 2496896, "di": 0, "day": "Monday", "title": "Running Strength Day + Hyrox Accessory & Aerobic Option", "tags": ["hyrox", "strength", "aerobic"], "html": "<h4><b>Prep (Optional but Recommended)<\/b><\/h4><ul><li><p>5 min Backwards Walking<\/p><\/li><li><p>Happy Hip<\/p><\/li><li><p>Marching Running Drills<\/p><\/li><li><p>A-Skips<\/p><\/li><li><p>B-Skips<\/p><\/li><\/ul><hr><h4><b>Main Strength Block<\/b><\/h4><p><b>Heels Elevated Eccentric Squat<\/b><\/p><ul><li><p>4/2/1/1 tempo — control matters here<\/p><\/li><\/ul><p><b>Tibialis Raise<\/b><\/p><ul><li><p>1 x 30 reps<\/p><\/li><\/ul><p><b>Calf Raise<\/b><\/p><ul><li><p>1 x 20–30 reps each leg<\/p><\/li><\/ul><p><b>Paloquin Step-Up<\/b><\/p><ul><li><p>2 x 20 reps<\/p><\/li><\/ul><p><b>ATG Lunges<\/b><\/p><ul><li><p>3 x 10 reps<\/p><\/li><\/ul><hr><h4><b>Super Set<\/b><\/h4><ul><li><p>Calf Isometric: 3 x 3 seconds hold<\/p><\/li><li><p>Jefferson Curls: 3 x 3 reps (go slow, go light, go smooth)<\/p><\/li><\/ul><hr><h4><b>Power + Plyos<\/b><\/h4><p><b>Med Ball Slam<\/b><\/p><ul><li><p>3 x 8 reps @ light weight, fast as possible<\/p><\/li><\/ul><p><b>Standing Vertical Jump or Drop Jump<\/b><\/p><ul><li><p>3 x 3 reps<\/p><\/li><\/ul><p><b>Sled Push<\/b><\/p><ul><li><p>2 x 37 m @ heavy and unbroken<\/p><\/li><li><p><b>Rest 3–5 minutes<\/b> — this should <i>hurt a little<\/i><\/p><\/li><\/ul><hr><h4><b>Finisher Super Set (3 Rounds)<\/b><\/h4><ul><li><p>8 x Barbell Reverse Curl<\/p><\/li><li><p>15 x Weighted V-Ups<\/p><\/li><li><p>Max Dead Hang<\/p><\/li><li><p><b>Rest 1 min between rounds<\/b><\/p><\/li><\/ul><hr><h4><b>HYROX Accessory Work<\/b><\/h4><ul><li><p>4 x 20 Wall Balls @ heavy weight<\/p><\/li><li><p><b>60 seconds rest between sets<\/b><\/p><\/li><li><p>Focus on breathing, accuracy, and strong upright posture under fatigue<\/p><\/li><\/ul><hr><h4><b>Aerobic Option<\/b><\/h4><p>Pick your poison:<\/p><p><b>Option 1:<\/b><\/p><ul><li><p>5 Rounds:<\/p><ul><li><p>3 min Row<\/p><\/li><li><p>3 min Ski<\/p><\/li><li><p>3 min Bike or Run<\/p><\/li><\/ul><\/li><\/ul><p><b>Option 2:<\/b><\/p><ul><li><p>50 min Continuous Run @ Easy–Moderate Effort<\/p><\/li><\/ul><hr><h4><b>Coaching Tips<\/b><\/h4><ul><li><p>Strength feeds speed. Explosive work builds resilience and finishing power.<\/p><\/li><li><p>Focus on quality reps. Control the tempo. Nail your form under load.<\/p><\/li><li><p>If you’re prepping for Hyrox or any hybrid event, don’t skip the sleds or wall balls — they pay off when it counts.<\/p><\/li><\/ul><blockquote><p><i>“Build the engine. Sharpen the weapon. Train with intent.”<\/i><\/p><\/blockquote>"}, {"id": 2496897, "di": 1, "day": "Tuesday", "title": "Threshold Progression Session", "tags": ["threshold"], "html": "<h4><b>Prep<\/b><\/h4><ul><li><p>5 min Backwards Walking<\/p><\/li><li><p>Happy Hip<\/p><\/li><li><p>Marching Running Drills<\/p><\/li><li><p>A-Skips<\/p><\/li><li><p>B-Skips<\/p><\/li><\/ul><hr><h4><b>Threshold Effort Run<\/b><\/h4><p><b>10–15 min Easy Aerobic Run Warm-Up<\/b><br><b>Strides<\/b><\/p><ul><li><p>6 x 100m @ ~90% effort with perfect distance form<\/p><\/li><li><p>Rest: 60 seconds between each<\/p><\/li><\/ul><hr><h4><b>Main Set (Threshold – Zone 4 Heart Rate)<\/b><\/h4><p><b>1 x 4000m @ Threshold<\/b><\/p><ul><li><p><i>Rest 2 mins<\/i><\/p><\/li><li><p><b>Note:<\/b> First 1–2k should feel “comfortable hard” before settling into a steady push. Don’t go out too hot.<\/p><\/li><\/ul><p><b>1 x 2000m @ Threshold<\/b><\/p><ul><li><p><i>Rest 90 seconds<\/i><\/p><\/li><\/ul><p><b>1 x 1000m @ Threshold<\/b><\/p><ul><li><p><i>Rest 90 seconds<\/i><\/p><\/li><\/ul><hr><h4><b>Cool-Down<\/b><\/h4><ul><li><p>10–15 min Easy Aerobic Run<\/p><\/li><\/ul><hr><h4><b>Coaching Tips<\/b><\/h4><ul><li><p>Threshold work is where durability is built. These are long, uncomfortable efforts — but they’re the sweet spot for making your engine more efficient.<\/p><\/li><li><p>Use the longer effort to settle in and find your rhythm. Finish the shorter ones with composure and form intact.<\/p><\/li><li><p>Don’t chase splits. Stay in control of your breathing and heart rate zone.<\/p><\/li><li><p><b>This is a confidence builder<\/b> — especially for pacing under fatigue.<\/p><\/li><\/ul><blockquote><p><i>“You don’t get faster by running hard. You get faster by running smart, consistently.”<\/i><\/p><\/blockquote>"}, {"id": 2496898, "di": 2, "day": "Wednesday", "title": "Mechanical Fartlek + Mobility", "tags": ["aerobic", "mobility"], "html": "<h4><b>Mobility (Kruse + Static Stretch Series)<\/b><\/h4><ul><li><p>Foot Roll<\/p><\/li><li><p>Ankle Roll (Out/In/Back)<\/p><\/li><li><p>Hip Roll<\/p><\/li><li><p>Knee Roll<\/p><\/li><li><p>Front Hip Roll<\/p><\/li><li><p>Pec Stretch<\/p><\/li><li><p>Lat Stretch (Prayer Stretch)<\/p><\/li><li><p>Couch Stretch<\/p><\/li><li><p>Knight Stretch<\/p><\/li><li><p>Pigeon Pose<\/p><\/li><\/ul><hr><h4><b>Main Effort: Mechanical Fartlek<\/b><\/h4><p><b>Duration:<\/b> 40 minutes<\/p><ul><li><p>3 mins <i>uptempo<\/i> @ perfect running form (HR cap = 180 - age or ~75% max HR)<\/p><\/li><li><p>2 mins <i>easy pace<\/i> @ perfect form, ~10–20 sec slower per mile<\/p><\/li><\/ul><p>✅ Stay in <b>Zone 2<\/b> throughout.<br>✅ This is not an all-out effort — it’s a rhythm builder.<br>✅ Use the “uptempo” segments to work form, not speed.<\/p><hr><h4><b>Aerobic Option (Alternate)<\/b><\/h4><p><b>30 min Cycling @ Zone 2<\/b><\/p><ul><li><p>Focus on cadence and smooth pedal stroke<\/p><\/li><li><p>Great for recovery and aerobic base building<\/p><\/li><\/ul><hr><h4><b>Coaching Tips<\/b><\/h4><ul><li><p>This is one of the most <i>underrated tools<\/i> for building aerobic power and muscular efficiency without accumulating stress.<\/p><\/li><li><p>Let form drive the pace. Think: tall posture, soft landing, quick turnover.<\/p><\/li><li><p>If you’re breathing through your nose or able to hold a conversation (barely), you’re likely right where you need to be.<\/p><\/li><\/ul><blockquote><p><i>“Most people don’t need to go harder — they need to go easier more often. That’s how you build durability.”<\/i><\/p><\/blockquote>"}, {"id": 2496899, "di": 3, "day": "Thursday", "title": "Running Strength Day + Hill Speed", "tags": ["speed", "strength"], "html": "<h4><b>Prep<\/b><\/h4><ul><li><p>5 minutes Backwards Walking<\/p><\/li><li><p>Happy Hip Circuit<\/p><\/li><li><p>Marching Running Drills<\/p><\/li><li><p>A-Skips<\/p><\/li><li><p>B-Skips<\/p><\/li><\/ul><hr><h4><b>Running Strength Day<\/b><\/h4><p><b>Heels Elevated Eccentric Squat<\/b><\/p><ul><li><p>Tempo: 4 seconds down / 2 second pause / 1 second up / 1 second reset<\/p><\/li><\/ul><p><b>Lower Body Prep &amp; Strength Series<\/b><\/p><ul><li><p>Tibialis Raise — 1x30 reps<\/p><\/li><li><p>Calf Raise — 1x 20–30 reps each leg<\/p><\/li><li><p>Paloquin Step Up — 2x20<\/p><\/li><li><p>ATG Lunges — 3x10<\/p><\/li><\/ul><p><b>Super Set<\/b><\/p><ul><li><p>Calf Isometric — 3x 3 seconds hold<\/p><\/li><li><p>Jefferson Curls — 3x3 reps<\/p><\/li><\/ul><p><b>Plyometric Block<\/b><\/p><ul><li><p>Single Leg Box Jump (stack plates or use low box) — 3x2<\/p><\/li><li><p>Standing Broad Jump — 3x3<\/p><\/li><\/ul><p><b>Strength + Power<\/b><\/p><ul><li><p>Barbell Reverse Lunge — 4x6 @ 60%–75% (focus on <i>speed with control<\/i>)<\/p><ul><li><p>Rest: 90–120 seconds<\/p><\/li><\/ul><\/li><li><p>Sled Pull — 2x37m @ <b>race weight<\/b> as fast as possible<\/p><\/li><\/ul><hr><h4><b>Hill Sprint Finishers<\/b><\/h4><p><b>Warm-Up Jog<\/b><\/p><ul><li><p>10–15 min easy aerobic run to your hill<\/p><\/li><\/ul><p><b>Main Set<\/b><\/p><ul><li><p>7x :30 uphill sprints<\/p><ul><li><p>Jog down for recovery<\/p><\/li><\/ul><\/li><\/ul><p><b>Cool-Down Jog<\/b><\/p><ul><li><p>20–30 min easy aerobic running<\/p><\/li><\/ul><hr><h4><b>Coaching Tips<\/b><\/h4><ul><li><p>The hill sprints + sled pulls hit similar neuromuscular pathways. Keep your form snappy and posture tall — this is about <b>power delivery<\/b>, not just effort.<\/p><\/li><li><p>Use your arms and drive from the hips. The goal isn't burnout — it’s <i>high-quality force production<\/i>.<\/p><\/li><li><p>Treat the sled pulls like an event: locked in, explosive, and intentional.<\/p><\/li><\/ul><blockquote><p><i>“Speed isn’t just about turnover — it’s how well you create and control force.”<\/i><\/p><\/blockquote>"}, {"id": 2496900, "di": 4, "day": "Friday", "title": "Rest Day", "tags": ["rest"], "html": ""}, {"id": 2496901, "di": 5, "day": "Saturday", "title": "Threshold with Machine Work (Compromised Run Focus)", "tags": ["threshold", "hyrox", "aerobic"], "html": "<h4><b>Prep<\/b><\/h4><ul><li><p>5 minutes Backwards Walking<\/p><\/li><li><p>Happy Hip Circuit<\/p><\/li><li><p>Marching Running<\/p><\/li><li><p>A-Skips<\/p><\/li><li><p>B-Skips<\/p><\/li><\/ul><hr><h4><b>Warm-Up<\/b><\/h4><ul><li><p>10–15 min easy aerobic run<\/p><\/li><li><p>5 x 100m “stride” (90% sprint with perfect distance running form)<\/p><ul><li><p>Rest 60 seconds between each<\/p><\/li><\/ul><\/li><\/ul><hr><h4><b>Main Set – Threshold Effort Under Fatigue<\/b><\/h4><p><b>2 Rounds<\/b><\/p><ul><li><p>1000m Ski @ Threshold<\/p><\/li><li><p>1000m Run @ Threshold<\/p><\/li><li><p>1000m Row @ Threshold<\/p><\/li><li><p>Rest 2 mins after each full round<\/p><\/li><\/ul><hr><p><b>Compromised Threshold Effort (E5MOM – Every 5 Minutes on the Minute)<\/b><br><b>2 Rounds:<\/b><\/p><ul><li><p>4 min Echo Bike @ Threshold<\/p><\/li><li><p>4 min Run @ Threshold<\/p><\/li><\/ul><p><b>Goal:<\/b> Hold your running form and breathing steady — don’t redline early. Smooth is fast here.<\/p><hr><h4><b>Cool Down<\/b><\/h4><ul><li><p>10–15 min easy aerobic run or bike<\/p><\/li><\/ul><hr><h4><b>Coaching Tips<\/b><\/h4><ul><li><p>You’re training your body and mind to recover <i>while moving<\/i>. Machines into running = real fatigue adaptation.<\/p><\/li><li><p>Your job is to <i>stay smooth<\/i>, not blow up. Trust the fitness you’ve built — this is about layering resilience on top.<\/p><\/li><li><p>Hold your form when it gets hard. That’s where your race fitness is made.<\/p><\/li><\/ul><blockquote><p><i>“Fitness is earned in fatigue. Form is the proof.”<\/i><\/p><\/blockquote>"}, {"id": 2496902, "di": 6, "day": "Sunday", "title": "Easy Effort + Mobility", "tags": ["aerobic", "mobility"], "html": "<h4><b>Mobility (Kruse + Static Stretch)<\/b><\/h4><p><b>Roll Out &amp; Joint Work:<\/b><\/p><ul><li><p>Foot Roll<\/p><\/li><li><p>Ankle Roll (In/Out/Back)<\/p><\/li><li><p>Hip Roll<\/p><\/li><li><p>Knee Roll<\/p><\/li><li><p>Front Hip Roll<\/p><\/li><\/ul><p><b>Static Stretch Flow:<\/b><\/p><ul><li><p>Standing Stretch<\/p><\/li><li><p>Laying Pec Stretch<\/p><\/li><li><p>Butterfly<\/p><\/li><li><p>90/90<\/p><\/li><li><p>Pigeon Pose<\/p><\/li><\/ul><hr><h4><b>Run<\/b><\/h4><p><b>60 min Easy Run @ Z2/Low Z3<\/b><\/p><ul><li><p>Focus on perfect form, steady breathing, and posture<\/p><\/li><li><p>This is aerobic base building — stay relaxed and efficient<\/p><\/li><li><p>You should finish feeling better than you started<\/p><\/li><\/ul><hr><h4><b>Bike (Optional / Bonus Aerobic Volume)<\/b><\/h4><p><b>30–35 min Easy Spin<\/b><\/p><ul><li><p>Keep HR low and cadence smooth<\/p><\/li><li><p>Great for flushing the legs and building low-impact aerobic capacity<\/p><\/li><\/ul><hr><h4><b>Coaching Notes<\/b><\/h4><blockquote><p><i>“Faster is not better. Smoother is better.”<\/i><br>Easy running is the foundation — it’s what allows you to go harder, longer, later. Nail the form now, and it’ll show up when it matters.<\/p><\/blockquote>"}, {"id": 3410177, "di": 6, "day": "Sunday", "title": "Sunday Recap – Week 10: Reflections", "tags": ["recap"], "recap": {"prompt": "How has your ability to stay controlled while running under fatigue changed?", "sub": "", "example": "My confidence under fatigue is getting stronger! I don’t panic when things get uncomfortable anymore. I settle in instead of trying to force pace."}}]}, {"n": 11, "label": "W11", "name": "Week 11", "sessions": [{"id": 2496903, "di": 0, "day": "Monday", "title": "Running Strength Day – Explosive & Efficient", "tags": ["strength"], "html": "<h4><b>Primary Strength Work<\/b><\/h4><ul><li><p><b>Heels Elevated Squat (Eccentric Tempo 4/2/1/1)<\/b><br><i>Control down, pause, explode up<\/i><\/p><\/li><li><p><b>Tibialis Raise<\/b><br>1x30 Reps<\/p><\/li><li><p><b>Single-Leg Calf Raise<\/b><br>1x20–30 Each Leg<br><i>Full range of motion — top to bottom<\/i><\/p><\/li><li><p><b>Paloquin Step-Up<\/b><br>2x20<br><i>Drive through the front leg only<\/i><\/p><\/li><li><p><b>ATG Lunge<\/b><br>3x10<br><i>Knee past toe, heel stays down, upright torso<\/i><\/p><\/li><\/ul><hr><h4><b>Super Set 1<\/b><\/h4><p>3 Rounds:<\/p><ul><li><p><b>Calf Isometric Hold<\/b> – 3x3 seconds<\/p><\/li><li><p><b>Jefferson Curl<\/b> – 3x3 reps<br><i>Slow, controlled, articulate every vertebrae<\/i><\/p><\/li><\/ul><hr><h4><b>Power &amp; Plyometrics<\/b><\/h4><ul><li><p><b>Med Ball Slam<\/b><br>3x8 (light weight, <i>as fast as possible<\/i>)<\/p><\/li><li><p><b>Standing Vertical or Drop Jump<\/b><br>3x3<\/p><\/li><\/ul><hr><h4><b>Sled Work<\/b><\/h4><ul><li><p><b>Heavy Sled Push<\/b><br>1x50m @ heavy (unbroken)<br><i>Then rest 3–5 mins<\/i><\/p><\/li><li><p><b>Lighter Sled Push<\/b><br>3x12m @ FAST<br><i>Drive hard, don’t coast<\/i><\/p><\/li><\/ul><hr><h4><b>Super Set 2<\/b><\/h4><p>3 Rounds:<\/p><ul><li><p>8 x <b>Barbell Reverse Curl<\/b><\/p><\/li><li><p>15 x <b>Weighted V-Ups<\/b><\/p><\/li><li><p><b>Max Dead Hang<\/b><br><i>Rest 1 min between rounds<\/i><\/p><\/li><\/ul><hr><h4><b>HYROX Accessory Work<\/b><\/h4><ul><li><p>4 Rounds:<br>30 x <b>Heavy Wall Balls<\/b><br><i>Rest 60 seconds<\/i><\/p><\/li><\/ul><hr><h4><b>Aerobic Option<\/b><\/h4><p>Choose one:<\/p><ul><li><p>5 Rounds:<\/p><ul><li><p>3 min Row<\/p><\/li><li><p>3 min Ski<\/p><\/li><li><p>3 min Bike or Run<\/p><\/li><\/ul><\/li><\/ul><p><b>OR<\/b><\/p><ul><li><p>50 min Steady Run @ Z2<\/p><\/li><\/ul><hr><h4><b>Coaching Notes<\/b><\/h4><blockquote><p><i>“Speed and power come from control and patience.”<\/i><br>This isn’t just lifting — it’s running-specific durability. Move like an athlete: controlled, explosive, and smooth.<\/p><\/blockquote>"}, {"id": 2496904, "di": 1, "day": "Tuesday", "title": "Threshold – Controlled Burn", "tags": ["threshold"], "html": "<h4><b>Prep<\/b><\/h4><ul><li><p>5 min <b>Backwards Walking<\/b><\/p><\/li><li><p><b>Happy Hip Flow<\/b><\/p><\/li><li><p><b>Marching Running<\/b><\/p><\/li><li><p><b>A-Skips<\/b><\/p><\/li><li><p><b>B-Skips<\/b><\/p><\/li><\/ul><p><i>Activate the hips, get tall, get light on your feet.<\/i><\/p><hr><h4><b>Main Set: Threshold with Strides<\/b><\/h4><ul><li><p>10–15 min <b>Easy Aerobic Run<\/b><\/p><\/li><li><p><b>6 x 100 m Stride<\/b><br>(90% sprint with perfect distance form)<br><i>Rest: 60 sec walk or jog<\/i><\/p><\/li><\/ul><hr><h4><b>Threshold Intervals<\/b><\/h4><ul><li><p><b>4–6 x 1600 m @ Threshold<\/b> (Zone 4 HR)<br><i>Recovery: 60 sec standing rest between reps<\/i><\/p><blockquote><p><b>Goal:<\/b> Hold the same pace as your 1000s from two weeks ago.<br>Start smooth, find your rhythm early, and keep the form clean.<\/p><\/blockquote><\/li><\/ul><hr><ul><li><p>Rest 2 min (walk, shake out)<\/p><\/li><\/ul><hr><ul><li><p>10–15 min <b>Easy Aerobic Run<\/b> (cool-down)<\/p><\/li><\/ul><hr><h4><b>Coaching Notes<\/b><\/h4><blockquote><p><i>“You don’t find your edge by blowing past it — you find it by brushing against it again and again.”<\/i><\/p><\/blockquote><p>This is threshold work — it’s meant to feel <i>controlled discomfort<\/i>. You should finish each 1600 feeling like you could do one more, not collapse. Stay locked into your form. That’s how you make progress that sticks.<\/p>"}, {"id": 2496905, "di": 2, "day": "Wednesday", "title": "Mechanical Fartlek – Flow and Form", "tags": ["aerobic"], "html": "<h4><b>Mobility (Kruse + Static Stretch)<\/b><\/h4><p>Loosen up, reset, and prep the system.<\/p><ul><li><p><b>Foot Roll<\/b><\/p><\/li><li><p><b>Ankle Roll<\/b> (Out / In / Back)<\/p><\/li><li><p><b>Hip Roll<\/b><\/p><\/li><li><p><b>Knee Roll<\/b><\/p><\/li><li><p><b>Front Hip Roll<\/b><\/p><\/li><\/ul><p><b>Static Stretches<\/b><\/p><ul><li><p><b>Pec Stretch<\/b> (Lying)<\/p><\/li><li><p><b>Lat Stretch<\/b> (Prayer position)<\/p><\/li><li><p><b>Couch Stretch<\/b><\/p><\/li><li><p><b>Knight Stretch<\/b><\/p><\/li><li><p><b>Butterfly<\/b><\/p><\/li><li><p><b>90/90<\/b><\/p><\/li><li><p><b>Pigeon Pose<\/b><\/p><\/li><\/ul><hr><h4><b>Run: Mechanical Fartlek<\/b><\/h4><p><b>40 minutes total<\/b><\/p><ul><li><p>3 min <b>Uptempo Running<\/b> (HR cap = 180 - age, or ~75% Max HR)<\/p><\/li><li><p>2 min <b>Form-focused cruise<\/b> (10–20 sec/mi slower)<\/p><\/li><\/ul><p><i>Repeat for duration. All in Zone 2.<\/i><\/p><hr><h4><b>Aerobic Option (If Needed)<\/b><\/h4><p><b>30 min Cycling<\/b><\/p><ul><li><p>Stay steady. Light tension. Keep HR in aerobic zone.<\/p><\/li><\/ul><hr><h4><b>Coaching Tips<\/b><\/h4><blockquote><p><i>“Efficiency is what wins. Not effort alone.”<\/i><\/p><\/blockquote><p>This is not a sprint-fest. It’s a <i>conversation between your engine and your form<\/i>. You’re teaching your body to stay smooth under effort and to recover while still moving well.<\/p>"}, {"id": 2496906, "di": 3, "day": "Thursday", "title": "Running Strength + Flat Speed Flow", "tags": ["speed", "strength"], "html": "<h4><b>Prep<\/b><\/h4><p>Start smooth. Prep the engine, wake the hips, get bouncy.<\/p><ul><li><p>5 min <b>Backwards Walking<\/b><\/p><\/li><li><p><b>Happy Hip Mobility<\/b><\/p><\/li><li><p><b>Marching Running Drills<\/b><\/p><\/li><li><p><b>A-Skips<\/b><\/p><\/li><li><p><b>B-Skips<\/b><\/p><\/li><\/ul><hr><h4><b>Strength Block: Running Power + Durability<\/b><\/h4><p><b>Heels Elevated Eccentric Squat<\/b> (4/2/1/1 tempo)<\/p><ul><li><p>Focus on full range + quad tension.<\/p><\/li><\/ul><p><b>Tibialis Raise<\/b> – 1 x 30<br><b>Calf Raise<\/b> – 1 x 20-30 each leg<br><b>Paloquin Step Up<\/b> – 2 x 20<br><b>ATG Lunges<\/b> – 3 x 10<\/p><p><b>Super Set<\/b><\/p><ul><li><p><b>Calf Isometric<\/b> – 3 x 3 seconds<\/p><\/li><li><p><b>Jefferson Curls<\/b> – 3 x 3 reps<\/p><\/li><\/ul><hr><h4><b>Power Block<\/b><\/h4><p><b>Single Leg Box Jump<\/b> – 3 x 2<br><b>Standing Broad Jump<\/b> – 3 x 3<br><b>Barbell Reverse Lunge<\/b> – 5 x 6 @ 60–75% (rest 90–120 sec)<br>→ Go light enough to move FAST with control.<\/p><p><b>Sled Pulls<\/b><\/p><ul><li><p>1 x 75m @ race weight (grind)<\/p><\/li><li><p>Rest 2 mins<\/p><\/li><li><p>2 x 25m @ lighter weight, FAST<\/p><\/li><\/ul><hr><h4><b>Flat Speed Session<\/b><\/h4><p><b>10–15 min easy aerobic run warm-up<\/b><\/p><p><b>Strides<\/b><\/p><ul><li><p>4 x 100m @ 90% effort<\/p><\/li><li><p>Rest 60 sec between<\/p><\/li><\/ul><p><b>Sprints (Distance Form Only)<\/b><\/p><ul><li><p>2 x 300m @ as fast as possible <i>without sprint form<\/i><\/p><\/li><li><p>4 x 150m same pace<\/p><\/li><li><p>Rest 2 mins between all<\/p><\/li><\/ul><p><b>10–15 min easy aerobic run cool-down<\/b><\/p><hr><h4><b>Coaching Tips<\/b><\/h4><blockquote><p>“Fast is fine. But smooth is everything.”<br>Don’t let speed sacrifice form. The goal today is powerful <i>distance running mechanics<\/i>, not max sprinting. Smooth turnover, relaxed face, and arms working with you—not against you.<\/p><\/blockquote>"}, {"id": 2496907, "di": 4, "day": "Friday", "title": "Rest Day", "tags": ["rest"], "html": ""}, {"id": 2496908, "di": 5, "day": "Saturday", "title": "Threshold & HYROX Flow", "tags": ["threshold", "hyrox"], "html": "<h4><b>Prep: Prime the Engine<\/b><\/h4><p>Get loose, dynamic, and ready to move.<\/p><ul><li><p>5 min <b>Backwards Walking<\/b><\/p><\/li><li><p><b>Happy Hip Mobility<\/b><\/p><\/li><li><p><b>Marching Running Drills<\/b><\/p><\/li><li><p><b>A-Skips<\/b><\/p><\/li><li><p><b>B-Skips<\/b><\/p><\/li><\/ul><hr><h4><b>Part 1: Threshold Run<\/b><\/h4><p><b>10–15 min easy aerobic run<\/b> to warm up<br><b>Strides:<\/b> 5 x 100m @ 90% effort<br>→ Rest 60 seconds between each<\/p><p><b>Main Effort:<\/b><\/p><ul><li><p><b>5000m @ threshold pace<\/b> (Zone 4 HR or controlled discomfort)<\/p><\/li><\/ul><p>→ <b>Rest 2 mins<\/b> before transitioning into HYROX-style work<\/p><hr><h4><b>Part 2: 20-Minute EMOM Grinder<\/b><\/h4><p>Every Minute On the Minute – cycle through:<\/p><ul><li><p>Min 0–1: <b>12–15 Cal Ski<\/b><\/p><\/li><li><p>Min 1–2: <b>15–20m Burpee Broad Jump<\/b><\/p><\/li><li><p>Min 2–3: <b>12–15 Cal Row<\/b><\/p><\/li><li><p>Min 3–4: <b>15–20 Wall Balls<\/b><\/p><\/li><\/ul><p><i>Adjust volume as needed to keep ~15 seconds of rest per station.<\/i><\/p><hr><h4><b>Cooldown<\/b><\/h4><p>10–15 min easy aerobic run or walk<br>→ Recover and reset the system<\/p><hr><h4><b>Coaching Tips<\/b><\/h4><blockquote><p>“It’s not just about surviving fatigue—it’s about holding your form inside it.”<\/p><\/blockquote><p>The 5k threshold run upfront is there to simulate real fatigue. From there, your job is to move into the machines and stations with control, intent, and grit.<\/p><p>Treat the EMOM as a pacing and form test. Fast is good—but clean is better.<\/p>"}, {"id": 2496909, "di": 6, "day": "Sunday", "title": "Endurance Engine + Mobility Reset", "tags": ["aerobic", "mobility"], "html": "<h4><b>Mobility (Kruse + Static Stretch Series)<\/b><\/h4><p>Start here. Loosen up, find your range, and prep the body for smooth work:<\/p><ul><li><p><b>Foot Roll<\/b><\/p><\/li><li><p><b>Ankle Roll (Out/In/Back)<\/b><\/p><\/li><li><p><b>Hip Roll<\/b><\/p><\/li><li><p><b>Knee Roll<\/b><\/p><\/li><li><p><b>Front Hip Roll<\/b><\/p><\/li><\/ul><p>Then flow through:<\/p><ul><li><p><b>Standing Stretch<\/b><\/p><\/li><li><p><b>Laying Pec Stretch<\/b><\/p><\/li><li><p><b>Butterfly Stretch<\/b><\/p><\/li><li><p><b>90/90<\/b><\/p><\/li><li><p><b>Pigeon Pose<\/b><\/p><\/li><\/ul><hr><h4><b>Aerobic Work<\/b><\/h4><p><b>Easy Run<\/b><\/p><p><b>60 minutes @ Z2/Low Z3<\/b><br>→ Perfect form, chill heart rate. Nothing fancy—just build the base.<\/p><p><b>Then:<\/b><\/p><p><b>30–35 minutes Easy Cycling<\/b><br>→ Spin out the legs, flush the system.<\/p><hr><h4><b>Coaching Notes<\/b><\/h4><blockquote><p>“Faster is not better. Better is better.”<\/p><\/blockquote><p>Today is about sharpening the <i>how<\/i>, not testing the <i>how fast<\/i>. Work on efficient movement and breathing. Stay smooth. Stay patient. That’s how endurance is built.<\/p>"}, {"id": 3410302, "di": 6, "day": "Sunday", "title": "Sunday Recap – Week 11: Reflections", "tags": ["recap"], "recap": {"prompt": "What part of your running do you trust more now than you did earlier in the program?", "sub": "(It could be pacing, effort, recovery, feel, or how you respond when things get uncomfortable.)", "example": "I am starting to trust my ability to settle into a run without forcing pace. Even when things feel a little off at the start, I know I can find rhythm if I stay patient."}}]}, {"n": 12, "label": "W12", "name": "Week 12", "sessions": [{"id": 2496910, "di": 0, "day": "Monday", "title": "Rest Day", "tags": ["rest"], "html": "<p>Rest Day<\/p>"}, {
